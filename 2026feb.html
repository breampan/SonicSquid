<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRCAM STMS 研究：聲音魅力工程</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 與 ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 引入 Babel 用於瀏覽器中編譯 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 引入 Lucide 圖標 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .notion-container iframe {
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>
<body class="bg-neutral-50 text-neutral-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 簡單的圖標組件封裝
        const Icon = ({ name, className }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, []);
            return <i data-lucide={name} className={className}></i>;
        };

        const App = () => {
            // 使用使用者提供的特定嵌入 URL
            const [rawUrl] = useState('https://curly-ketch-268.notion.site/ebd/2ea4f4d665ce8077ab37fef4b6b31ef2');
            const [activeTab, setActiveTab] = useState('theory');

            const insights = [
                {
                    id: 'theory',
                    title: '社會—技術路徑 (Socio-technological)',
                    icon: 'book-open',
                    content: '超越物理聲音的設計。設計的核心不在於波形，而在於聽者如何理解經驗。這是一種由「聽覺行為 (Listening)」而非單純「聲音 (Sound)」驅動的方法。',
                    tags: ['IRCAM 2022', '感官經驗', '語義映射']
                },
                {
                    id: 'ecosystem',
                    title: '聲音生態系與競合關係',
                    icon: 'layout',
                    content: '單一聲音不再孤立存在。在產品環境中，不同類別的聲音需要相互「競爭」頻譜與時間空間，透過良好的調度達成和諧感與連貫的品牌敘事。',
                    tags: ['聲音競合', '敘事連貫性', '和諧度']
                },
                {
                    id: 'charisma',
                    title: '魅力工程：參數轉化',
                    icon: 'settings',
                    content: '將抽象美感量化。例如「優雅」對應純淨音色與長尾韻；「可靠」對應低頻重心與低粗糙度。透過精準控制譜重心與包絡來實現。',
                    tags: ['魅力工程', '聲學描述符', '品牌識別']
                }
            ];

            return (
                <div className="min-h-screen">
                    <nav className="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-neutral-200 px-6 py-4 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <div className="bg-black p-1.5 rounded-lg flex items-center justify-center">
                                <Icon name="activity" className="text-white w-5 h-5" />
                            </div>
                            <h1 className="font-bold text-xl tracking-tight">IRCAM STMS 研究：聲音魅力工程</h1>
                        </div>
                        <div className="flex gap-4 text-sm font-medium">
                            <button onClick={() => setActiveTab('theory')} className={`hover:text-blue-600 transition ${activeTab === 'theory' ? 'text-blue-600' : ''}`}>理論框架分析</button>
                            <a href="#notion-section" className="text-neutral-500 hover:text-blue-600 transition">實作與音檔展示</a>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto px-6 py-12 grid grid-cols-1 lg:grid-cols-12 gap-12">
                        <div className="lg:col-span-4 space-y-6">
                            <div className="bg-amber-50 border border-amber-200 p-5 rounded-2xl flex gap-3">
                                <Icon name="alert-circle" className="w-5 h-5 text-amber-600 shrink-0" />
                                <div>
                                    <p className="text-xs font-bold text-amber-800 uppercase mb-1">提示：內容顯示問題</p>
                                    <p className="text-[11px] text-amber-700 leading-relaxed">
                                        已更換為專用嵌入網址。若內容仍顯示異常，請確認您的 Notion 頁面已點擊右上角的 <b>「Share」→「Publish」→「Publish to web」</b>。
                                    </p>
                                </div>
                            </div>

                            <section className="space-y-4">
                                <h2 className="text-sm font-bold text-neutral-400 uppercase tracking-widest flex items-center gap-2">
                                    <Icon name="info" className="w-4 h-4" /> 核心文獻亮點
                                </h2>
                                {insights.map((item) => (
                                    <div 
                                        key={item.id}
                                        className={`p-6 rounded-2xl border transition-all cursor-pointer ${activeTab === item.id ? 'bg-white shadow-xl border-blue-200 ring-1 ring-blue-50' : 'bg-transparent border-neutral-200 opacity-80'}`}
                                        onClick={() => setActiveTab(item.id)}
                                    >
                                        <div className="flex items-center gap-3 mb-3">
                                            <div className={`${activeTab === item.id ? 'text-blue-600' : 'text-neutral-400'}`}>
                                                <Icon name={item.icon} className="w-5 h-5" />
                                            </div>
                                            <h3 className="font-bold">{item.title}</h3>
                                        </div>
                                        <p className="text-sm text-neutral-600 leading-relaxed mb-4">{item.content}</p>
                                        <div className="flex flex-wrap gap-2">
                                            {item.tags.map(tag => (
                                                <span key={tag} className="text-[10px] px-2 py-1 bg-neutral-100 text-neutral-500 rounded-full font-medium">#{tag}</span>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </section>
                        </div>

                        <div className="lg:col-span-8 space-y-8">
                            <div className="bg-white p-10 rounded-3xl border border-neutral-200 shadow-sm relative overflow-hidden">
                                <h2 className="text-3xl font-black mb-6 tracking-tight">
                                    從「聲音物理」走向<br />
                                    <span className="text-blue-600">「聽覺經驗」的設計轉移</span>
                                </h2>
                                <div className="grid md:grid-cols-2 gap-8 text-neutral-600">
                                    <div className="space-y-4 text-sm leading-relaxed">
                                        <p className="font-medium text-neutral-900 border-l-4 border-blue-500 pl-4">
                                            研究指出，聲音魅力源於「精準的語義映射」。
                                        </p>
                                        <p>優雅感的實現透過高譜重心與長尾韻組合；可靠感則依賴低頻重心的穩定性。</p>
                                    </div>
                                    <div className="space-y-4 text-sm leading-relaxed">
                                        <p>聲音生態系強調「競合」。當多個 UI 聲音同時存在時，協調頻譜空間才能建立連貫的品牌敘事。</p>
                                    </div>
                                </div>
                            </div>

                            <div id="notion-section" className="space-y-4">
                                <div className="flex justify-between items-end px-2">
                                    <div>
                                        <h2 className="text-lg font-bold">Merry Sound Design</h2>
                                        <p className="text-xs text-neutral-400 italic">使用專用嵌入來源載入中...</p>
                                    </div>
                                    <a href="https://curly-ketch-268.notion.site/Merry-Sound-Design-2ea4f4d665ce8077ab37fef4b6b31ef2" target="_blank" className="flex items-center gap-1.5 text-xs text-blue-600 font-medium hover:underline">
                                        在 Notion 中開啟 <Icon name="external-link" className="w-3 h-3" />
                                    </a>
                                </div>
                                
                                <div className="notion-container w-full bg-white rounded-3xl border border-neutral-200 shadow-2xl overflow-hidden min-h-[800px] relative">
                                    <iframe
                                        src={rawUrl}
                                        width="100%"
                                        height="850px"
                                        frameBorder="0"
                                        allowFullScreen
                                        title="Notion Study Log"
                                        className="bg-white w-full"
                                    ></iframe>
                                </div>
                            </div>
                        </div>
                    </main>

                    <footer className="max-w-7xl mx-auto px-6 py-12 border-t border-neutral-200 flex flex-col md:flex-row justify-between items-center text-neutral-400 text-[11px] uppercase tracking-widest font-bold">
                        <span>© 2024 CHARISMA ENGINEERING RESEARCH EXHIBITION</span>
                        <div className="flex gap-6">
                            <span>IRCAM STMS PDS TEAM</span>
                            <span>SONIC IDENTITY SYSTEM</span>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
