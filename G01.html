<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數位再生水族箱 - 物理全環境版</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #01050a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        /* 場景控制容器 */
        #scene-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(5, 15, 25, 0.6);
            backdrop-filter: blur(25px);
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid rgba(100, 220, 255, 0.1);
            z-index: 100;
        }

        .scene-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(200, 240, 255, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .scene-btn.active {
            background: rgba(100, 220, 255, 0.2);
            border-color: #64dcff;
            color: #fff;
            box-shadow: 0 0 20px rgba(100, 220, 255, 0.2);
        }

        #ui-overlay {
            position: absolute;
            top: 25px;
            right: 25px;
            color: rgba(100, 220, 255, 0.5);
            pointer-events: none;
            z-index: 10;
            text-align: right;
        }

        .instruction { font-size: 14px; letter-spacing: 3px; font-weight: 300; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div class="instruction">AQUATIC TOTAL SPATIAL ENGINE</div>
    </div>

    <div id="scene-controls">
        <button class="scene-btn active" onclick="setScene('bathroom')">清澈水域</button>
        <button class="scene-btn" onclick="setScene('station')">深海大教堂</button>
        <button class="scene-btn" onclick="setScene('cave')">幽暗海洞</button>
        <button class="scene-btn" onclick="setScene('forest')">水下森林</button>
    </div>

    <canvas id="appCanvas"></canvas>

    <script>
        /**
         * 數位再生水族箱 - 物理全環境修復版
         * 修正：addColorStop 非有限數值錯誤。
         * 功能：所有聲音通過空間卷積，具備強力都普勒與側鏈 Ducking。
         */
        const canvas = document.getElementById('appCanvas');
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth, height = window.innerHeight, dpr = window.devicePixelRatio || 1;
        let listenerPlaneY = height * 0.55; 

        // --- 核心音訊系統 ---
        let audioCtx;
        let convolver, masterDry, masterWet, masterCompressor;
        let currentScene = 'bathroom';
        let noiseBuffer = null;

        const WAVE_TYPES = {
            SINE: { id: 'sine', color: '100, 220, 255' },
            TRIANGLE: { id: 'triangle', color: '255, 204, 170' },
            NOISE: { id: 'noise', color: '160, 255, 170' },
            BOATMAN: { id: 'boatman', color: '255, 85, 68' }
        };

        let activeObjects = []; 
        let paletteIcons = [];
        let fishParticles = [];
        const activePointers = new Map();

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterCompressor = audioCtx.createDynamicsCompressor();
            masterCompressor.threshold.value = -24; 
            masterCompressor.connect(audioCtx.destination);
            
            convolver = audioCtx.createConvolver();
            masterDry = audioCtx.createGain();
            masterWet = audioCtx.createGain();
            
            masterDry.connect(masterCompressor);
            convolver.connect(masterWet);
            masterWet.connect(masterCompressor);
            
            const bufferSize = audioCtx.sampleRate * 2; 
            noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
            
            applySceneAudio(currentScene);
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function generateIR(sceneType) {
            if (!audioCtx) return null;
            const sampleRate = audioCtx.sampleRate;
            let length = 1.0, decay = 5.0, lpFreq = 15000;
            if (sceneType === 'bathroom') { length = 0.6; decay = 8.0; lpFreq = 8000; } 
            else if (sceneType === 'station') { length = 3.5; decay = 1.8; lpFreq = 6000; } 
            else if (sceneType === 'cave') { length = 2.8; decay = 3.5; lpFreq = 1200; } 
            else { length = 1.2; decay = 4.5; lpFreq = 3000; }
            
            const frameCount = Math.floor(sampleRate * length);
            const buffer = audioCtx.createBuffer(2, frameCount, sampleRate);
            const filterAlpha = Math.min(1.0, (2 * Math.PI * lpFreq) / sampleRate);
            for (let channel = 0; channel < 2; channel++) {
                const data = buffer.getChannelData(channel);
                let lastVal = 0;
                for (let i = 0; i < frameCount; i++) {
                    let t = i / sampleRate;
                    let noise = (Math.random() * 2 - 1);
                    lastVal += filterAlpha * (noise - lastVal);
                    data[i] = lastVal * Math.exp(-decay * t) * 0.4;
                }
            }
            return buffer;
        }

        function applySceneAudio(scene) {
            if (!audioCtx) return;
            const ir = generateIR(scene);
            if (ir) convolver.buffer = ir;
            const now = audioCtx.currentTime;
            if (scene === 'bathroom') { masterDry.gain.setTargetAtTime(0.85, now, 0.1); masterWet.gain.setTargetAtTime(0.3, now, 0.1); }
            else if (scene === 'station') { masterDry.gain.setTargetAtTime(0.65, now, 0.1); masterWet.gain.setTargetAtTime(0.6, now, 0.1); }
            else if (scene === 'cave') { masterDry.gain.setTargetAtTime(0.55, now, 0.1); masterWet.gain.setTargetAtTime(0.75, now, 0.1); }
            else { masterDry.gain.setTargetAtTime(0.8, now, 0.1); masterWet.gain.setTargetAtTime(0.4, now, 0.1); }
        }

        window.setScene = (scene) => {
            initAudio(); currentScene = scene;
            document.querySelectorAll('.scene-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            applySceneAudio(scene);
        };

        function drawGeometry(ctx, type, x, y, baseSize, rgbStr, alpha = 1.0, pulse = 0, modFreq = 0, modDepth = 0) {
            const isBehind = y > listenerPlaneY;
            const distFromPlane = Math.abs(y - listenerPlaneY);
            const depthFactor = Math.max(0.3, 1.4 - (distFromPlane / (height * 0.5 || 1)));
            let currentSize = baseSize * depthFactor;
            if (type === 'sine' || type === 'triangle') currentSize *= 1.25; 

            ctx.save();
            ctx.translate(x, y);
            if (isBehind) { ctx.setLineDash([4, 4]); alpha *= 0.45; }

            const glowSize = currentSize * (isBehind ? 2 : 4);
            const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, glowSize);
            glow.addColorStop(0, `rgba(${rgbStr}, ${alpha * 0.4})`);
            glow.addColorStop(1, 'transparent');
            ctx.fillStyle = glow;
            ctx.beginPath(); ctx.arc(0, 0, glowSize, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = `rgba(${rgbStr}, ${alpha})`;
            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.8})`;
            ctx.lineWidth = isBehind ? 1.5 : 2.5;

            if (type === 'sine') {
                const ringPulse = Math.sin(pulse * 0.5) * 5;
                ctx.beginPath(); ctx.arc(0, 0, currentSize * 0.65 + ringPulse, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.rotate(pulse * (0.3 + (modFreq / 100))); 
                ctx.beginPath(); ctx.arc(currentSize * 0.4, 0, currentSize * 0.35 + (modDepth/200)*10, 0, Math.PI * 2); ctx.stroke();
            } else if (type === 'triangle') {
                const modScale = 1.0 + (modDepth / 250) * 0.15 * Math.sin(pulse * 2.5);
                ctx.save(); ctx.rotate(pulse * 0.15);
                const s1 = currentSize * 1.2;
                ctx.beginPath(); ctx.moveTo(0, -s1); ctx.lineTo(s1, s1 * 0.8); ctx.lineTo(-s1, s1 * 0.8); ctx.closePath(); ctx.stroke(); ctx.restore();
                ctx.save(); ctx.rotate(-pulse * (0.2 + modFreq/200));
                const s2 = currentSize * 0.75 * modScale;
                ctx.beginPath(); ctx.moveTo(0, s2); ctx.lineTo(s2, -s2 * 0.8); ctx.lineTo(-s2, -s2 * 0.8); ctx.closePath(); if (!isBehind) ctx.fill(); ctx.stroke(); ctx.restore();
            } else if (type === 'noise') {
                const jitter = modFreq > 15 ? 0.5 : 0.2; 
                ctx.beginPath();
                for (let i = 0; i < 12; i++) {
                    let r = currentSize * (0.8 + Math.random() * jitter);
                    let a = (i / 12) * Math.PI * 2;
                    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                }
                ctx.closePath(); ctx.fill(); ctx.stroke();
            } else if (type === 'boatman') {
                ctx.rotate(pulse * 0.2); const s = currentSize * 0.9;
                ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s * 0.6, 0); ctx.lineTo(0, s); ctx.lineTo(-s * 0.6, 0); ctx.closePath(); if (!isBehind) ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(s * 0.4, -s * 0.3); ctx.lineTo(s * 1.2, -s * 0.8); ctx.moveTo(-s * 0.4, -s * 0.3); ctx.lineTo(-s * 1.2, -s * 0.8); ctx.stroke();
            }
            ctx.restore();
        }

        class FishCreature {
            constructor(x, y, rgb) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 4; this.vy = (Math.random() - 0.5) * 4;
                this.rgb = rgb; this.size = Math.random() * 2 + 2;
                this.life = 1.0; this.decay = 0.005 + Math.random() * 0.005;
                setTimeout(() => this.playDeepPulse(), Math.random() * 800);
            }
            playDeepPulse() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();
                osc.type = 'sine';
                const startFreq = 45 + Math.random() * 40;
                osc.frequency.setValueAtTime(startFreq, now);
                osc.frequency.exponentialRampToValueAtTime(startFreq * 1.8, now + 0.08);
                osc.frequency.exponentialRampToValueAtTime(startFreq * 0.5, now + 0.3);
                filter.type = 'lowpass'; filter.frequency.setValueAtTime(200, now); filter.Q.value = 10;
                g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(0.12, now + 0.02); g.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.connect(filter); filter.connect(g); g.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.5);
            }
            update(target) {
                if (target) {
                    let dx = target.x - this.x; let dy = target.y - this.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist > 15) { this.vx += (dx / dist) * 0.25; this.vy += (dy / dist) * 0.25; }
                }
                this.vx *= 0.94; this.vy *= 0.94;
                this.x += this.vx; this.y += this.vy;
                this.life -= this.decay;
            }
            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(Math.atan2(this.vy, this.vx));
                ctx.fillStyle = `rgba(${this.rgb}, ${this.life * 0.7})`;
                ctx.beginPath(); ctx.moveTo(this.size * 2, 0); ctx.quadraticCurveTo(0, this.size, -this.size, 0); ctx.quadraticCurveTo(0, -this.size, this.size * 2, 0); ctx.fill();
                ctx.restore();
            }
        }

        class DraggableSound {
            constructor(typeConfig, x, y) {
                this.type = typeConfig.id; this.rgb = typeConfig.color; this.x = x; this.y = y;
                this.smoothedX = x; this.smoothedY = y;
                this.prevDist = 0; this.velocity = 0; this.dopplerFactor = 1.0; 
                this.isDragging = false; this.isFading = false;
                this.life = 1.0; this.pulse = 0;
                this.source = null; this.modulator = null; this.modGain = null; 
                this.filter = null; this.airFilter = null; 
                this.gain = null; this.sidechainGain = null; 
                this.panner = null;
                this.currentModFreq = 0; this.currentModDepth = 0; 
            }

            play() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                if (this.source) {
                    this.isFading = false; this.life = 1.0;
                    if (this.gain) { this.gain.gain.cancelScheduledValues(now); this.gain.gain.setTargetAtTime(0.25, now, 0.1); }
                    return; 
                }
                this.isFading = false; this.life = 1.0;
                this.gain = audioCtx.createGain(); 
                this.sidechainGain = audioCtx.createGain(); 
                this.panner = audioCtx.createPanner();
                this.airFilter = audioCtx.createBiquadFilter();
                this.airFilter.type = 'lowpass';

                this.panner.panningModel = (this.type === 'sine') ? 'equalpower' : 'HRTF';
                this.panner.distanceModel = 'inverse'; 
                this.panner.refDistance = 1.0;
                this.panner.rolloffFactor = 1.8;
                
                this.gain.gain.value = 0.0001; this.sidechainGain.gain.value = 1.0;

                if (this.type === 'sine' || this.type === 'triangle') {
                    this.source = audioCtx.createOscillator(); 
                    this.modulator = audioCtx.createOscillator(); 
                    this.modGain = audioCtx.createGain();
                    this.source.type = this.type; this.modulator.type = 'sine';
                    this.modulator.connect(this.modGain);
                    this.modGain.connect(this.source.frequency);
                    this.source.connect(this.airFilter);
                    this.modulator.start(now);
                } else if (this.type === 'noise') {
                    this.source = audioCtx.createBufferSource(); this.source.buffer = noiseBuffer; this.source.loop = true;
                    this.filter = audioCtx.createBiquadFilter(); this.filter.type = 'bandpass'; 
                    this.source.connect(this.filter); this.filter.connect(this.airFilter);
                } else if (this.type === 'boatman') {
                    this.source = audioCtx.createOscillator(); this.source.type = 'sawtooth'; 
                    this.source.frequency.value = 3800;
                    this.pulseGain = audioCtx.createGain();
                    for(let i=0; i<1500; i++) { 
                        let t = now + 0.05 + i/15;
                        this.pulseGain.gain.setValueAtTime(0, t); this.pulseGain.gain.linearRampToValueAtTime(1, t+0.005); this.pulseGain.gain.exponentialRampToValueAtTime(0.001, t+0.04);
                    }
                    this.source.connect(this.pulseGain); this.pulseGain.connect(this.airFilter);
                }

                this.airFilter.connect(this.panner);
                this.panner.connect(this.sidechainGain);
                this.sidechainGain.connect(this.gain);
                this.updatePanner(true);
                this.gain.gain.setTargetAtTime(0.25, now + 0.05, 0.1);
                this.gain.connect(masterDry);
                this.gain.connect(convolver);
                this.source.start(now + 0.05);
            }

            updatePanner(isInit = false) {
                if (!this.panner || !audioCtx) return;
                const now = audioCtx.currentTime;
                const posX = (this.smoothedX / width) * 6 - 3;
                const distZNorm = (this.smoothedY - listenerPlaneY) / (height * 0.4 || 1);
                const posZ = distZNorm * 4.5;
                const tc = isInit ? 0.001 : 0.15;

                const currentDist = Math.sqrt(posX*posX + posZ*posZ);
                if (!isInit) {
                    this.velocity = (currentDist - this.prevDist) * 70; 
                    const speedOfSound = 90; 
                    this.dopplerFactor = speedOfSound / (speedOfSound + this.velocity);
                    this.dopplerFactor = Math.max(0.4, Math.min(2.2, this.dopplerFactor));
                }
                this.prevDist = currentDist;

                this.panner.positionX.setTargetAtTime(posX, now, tc);
                this.panner.positionZ.setTargetAtTime(posZ, now, tc);
                this.panner.positionY.setTargetAtTime(-1.0, now, tc);

                const zAbs = Math.abs(distZNorm);
                if (this.airFilter) {
                    const airFreq = 20000 - (zAbs * 18500);
                    this.airFilter.frequency.setTargetAtTime(Math.max(400, airFreq), now, 0.12);
                }

                if (this.gain && this.isDragging) {
                    const proximityBoost = 1.0 + (1.0 - Math.min(1.0, zAbs)) * 1.0; 
                    this.gain.gain.setTargetAtTime(0.25 * proximityBoost * this.life, now, 0.1);
                }

                if (this.type === 'boatman') return; 

                if (this.type === 'noise' && this.filter) {
                    const baseFreq = 4000 - (zAbs * 2500);
                    this.filter.frequency.setTargetAtTime(baseFreq * this.dopplerFactor, now, 0.1);
                    this.filter.Q.setTargetAtTime(Math.max(1.5, 25 - (zAbs * 23.5)), now, 0.2);
                    this.currentModFreq = this.filter.Q.value;
                } else if ((this.type === 'sine' || this.type === 'triangle') && this.modulator) {
                    const xRatio = (this.smoothedX / width);
                    const modFreq = 0.5 + xRatio * (this.type === 'sine' ? 80 : 150);
                    this.modulator.frequency.setTargetAtTime(modFreq, now, 0.2);
                    this.currentModFreq = modFreq;
                    const depthLimit = this.type === 'sine' ? 120 : 250;
                    const modDepth = Math.max(0, (1 - zAbs) * depthLimit);
                    this.modGain.gain.setTargetAtTime(modDepth, now, 0.2);
                    this.currentModDepth = modDepth;
                    const h = Math.max(0, Math.min(1, 1 - (this.smoothedY / (height || 1))));
                    const baseFreq = 150 + h * 400;
                    this.source.frequency.setTargetAtTime((baseFreq * this.dopplerFactor), now, 0.08);
                }
            }

            startFade() {
                this.isFading = true; this.isDragging = false;
                this.velocity = 0; this.dopplerFactor = 1.0; 
                if (this.gain) {
                    this.gain.gain.cancelScheduledValues(audioCtx.currentTime);
                    this.gain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 5.0); 
                }
            }

            update() {
                this.pulse += 0.08;
                if (this.isDragging) {
                    this.smoothedX += (this.x - this.smoothedX) * 0.22; 
                    this.smoothedY += (this.y - this.smoothedY) * 0.22;
                    this.updatePanner();
                    if (Math.random() > 0.96) fishParticles.push(new FishCreature(this.x, this.y, this.rgb));
                }
                if (this.isFading) { 
                    this.life -= 1.0 / 960; 
                    if (this.life <= 0) { 
                        if(this.source) try{this.source.stop();}catch(e){} 
                        if(this.modulator) try{this.modulator.stop();}catch(e){}
                        this.source = null;
                    } 
                }
            }
            draw(ctx) { if (this.life <= 0) return; drawGeometry(ctx, this.type, this.x, this.y, 28, this.rgb, this.life * (this.isDragging ? 1.0 : 0.4), this.pulse, this.currentModFreq, this.currentModDepth); }
        }

        function applySidechainDucking() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            let aggressor = null;
            let maxV = 1.2; 
            activeObjects.forEach(obj => {
                if (obj.isDragging && Math.abs(obj.velocity) > maxV) {
                    maxV = Math.abs(obj.velocity); aggressor = obj;
                }
            });
            activeObjects.forEach(obj => {
                if (!obj.sidechainGain) return;
                let duckingLevel = 1.0;
                if (aggressor && obj !== aggressor) {
                    const d = Math.sqrt((obj.x - aggressor.x)**2 + (obj.y - aggressor.y)**2);
                    if (d < 350) duckingLevel = 0.1 + (d / 350) * 0.9;
                }
                obj.sidechainGain.gain.setTargetAtTime(duckingLevel, now, 0.08);
            });
        }

        function drawMonitor(ctx) {
            const mvWidth = 160; const mvHeight = 140; const mvX = 25; const mvY = 25;
            ctx.save();
            ctx.fillStyle = 'rgba(2, 10, 20, 0.85)'; ctx.strokeStyle = 'rgba(100, 220, 255, 0.15)';
            ctx.beginPath(); ctx.moveTo(mvX + 15, mvY); ctx.lineTo(mvX + mvWidth, mvY); ctx.lineTo(mvX + mvWidth - 15, mvY + mvHeight); ctx.lineTo(mvX, mvY + mvHeight); ctx.closePath(); ctx.fill(); ctx.stroke();
            const viewX = mvX + mvWidth / 2; const viewY = mvY + mvHeight * 0.65;
            ctx.fillStyle = 'rgba(100, 220, 255, 0.2)';
            ctx.beginPath(); ctx.ellipse(viewX, viewY, 12, 5, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(viewX, viewY - 8, 5, 0, Math.PI * 2); ctx.fill();
            activeObjects.forEach(obj => {
                const relX = ((obj.smoothedX / width) * 2 - 1) * 45;
                const relZ = ((obj.smoothedY - listenerPlaneY) / height) * 140; 
                ctx.fillStyle = `rgba(${obj.rgb}, ${obj.life})`;
                const mSize = 2.5 * obj.life;
                ctx.beginPath(); 
                const stretch = obj.velocity * 0.18;
                ctx.ellipse(viewX + relX, viewY + relZ * 0.5 - 10, mSize, mSize + Math.abs(stretch), 0, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();
        }

        function drawWater() {
            // 背景漸層
            const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
            bgGrad.addColorStop(0, '#021020');
            
            // 安全計算漸層停點，防止 NaN/Infinity
            let stopPos = listenerPlaneY / (height || 1);
            if (!isFinite(stopPos) || stopPos < 0) stopPos = 0.55;
            if (stopPos > 1) stopPos = 1;
            
            bgGrad.addColorStop(stopPos, '#010810');
            bgGrad.addColorStop(1, '#000000');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // 交界層
            const layerGrad = ctx.createLinearGradient(0, listenerPlaneY - 80, 0, listenerPlaneY + 80);
            layerGrad.addColorStop(0, 'transparent');
            layerGrad.addColorStop(0.5, 'rgba(100, 220, 255, 0.08)');
            layerGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = layerGrad;
            ctx.fillRect(0, listenerPlaneY - 80, width, 160);

            // 波紋
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(100, 220, 255, 0.15)';
            ctx.lineWidth = 1;
            const t = Date.now() * 0.001;
            for(let x=0; x<=width; x+=30) {
                const y = listenerPlaneY + Math.sin(x*0.01 + t) * 4;
                if(x===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        function initLayout() {
            dpr = window.devicePixelRatio || 1;
            width = window.innerWidth; height = window.innerHeight;
            canvas.width = width * dpr; canvas.height = height * dpr;
            canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
            ctx.scale(dpr, dpr);
            listenerPlaneY = height * 0.55; 
            paletteIcons = [
                { typeConfig: WAVE_TYPES.SINE, x: width - 50, y: 70 },
                { typeConfig: WAVE_TYPES.TRIANGLE, x: width - 50, y: 150 },
                { typeConfig: WAVE_TYPES.NOISE, x: width - 50, y: 230 },
                { typeConfig: WAVE_TYPES.BOATMAN, x: width - 50, y: 310 }
            ];
        }

        function animate() {
            drawWater(); drawMonitor(ctx);
            applySidechainDucking(); 
            ctx.fillStyle = 'rgba(255, 255, 255, 0.01)'; ctx.fillRect(width - 90, 0, 90, 380);
            paletteIcons.forEach(p => { drawGeometry(ctx, p.typeConfig.id, p.x, p.y, 20, p.typeConfig.color, 0.7, Date.now()*0.002, 0, 0); });
            for (let i = activeObjects.length - 1; i >= 0; i--) {
                activeObjects[i].update(); activeObjects[i].draw(ctx);
                if (activeObjects[i].life <= 0 && activeObjects[i].isFading) activeObjects.splice(i, 1);
            }
            for (let i = fishParticles.length - 1; i >= 0; i--) {
                const p = fishParticles[i]; p.update(activeObjects.find(o => !o.isFading)); p.draw(ctx);
                if (p.life <= 0) fishParticles.splice(i, 1);
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('pointerdown', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            initAudio(); const pt = { x: e.clientX, y: e.clientY };
            for (let i = activeObjects.length - 1; i >= 0; i--) {
                const obj = activeObjects[i];
                if (Math.sqrt((pt.x-obj.x)**2 + (pt.y-obj.y)**2) < 55) {
                    obj.isDragging = true; obj.pointerId = e.pointerId; activePointers.set(e.pointerId, obj); obj.play(); 
                    activeObjects.push(activeObjects.splice(i, 1)[0]); return;
                }
            }
            for (let i = 0; i < paletteIcons.length; i++) {
                const p = paletteIcons[i];
                if (Math.sqrt((pt.x-p.x)**2 + (pt.y-p.y)**2) < 40) {
                    const newObj = new DraggableSound(p.typeConfig, pt.x, pt.y);
                    newObj.isDragging = true; newObj.pointerId = e.pointerId;
                    activeObjects.push(newObj); activePointers.set(e.pointerId, newObj); newObj.play(); return;
                }
            }
        });
        window.addEventListener('pointermove', (e) => { if (activePointers.has(e.pointerId)) { const obj = activePointers.get(e.pointerId); obj.x = e.clientX; obj.y = e.clientY; } });
        window.addEventListener('pointerup', (e) => { if (activePointers.has(e.pointerId)) { const obj = activePointers.get(e.pointerId); obj.startFade(); activePointers.delete(e.pointerId); } });
        window.addEventListener('resize', initLayout);
        initLayout(); animate();
    </script>
</body>
</html>
