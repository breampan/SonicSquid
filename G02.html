<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聽能定向訓練系統 - 動態版</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #01050a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none; -webkit-user-select: none;
        }
        canvas { display: block; touch-action: none; }

        #scene-controls {
            position: absolute; bottom: 25px; left: 50%;
            transform: translateX(-50%); display: flex; gap: 8px;
            background: rgba(5, 15, 25, 0.6); backdrop-filter: blur(25px);
            padding: 10px 18px; border-radius: 40px;
            border: 1px solid rgba(100, 220, 255, 0.1); z-index: 100;
            max-width: 90vw; overflow-x: auto;
        }

        .scene-btn {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(200, 240, 255, 0.6); padding: 7px 14px; border-radius: 20px;
            cursor: pointer; font-size: 13px; transition: all 0.4s;
            white-space: nowrap;
        }
        .scene-btn.active { background: rgba(100, 220, 255, 0.2); border-color: #64dcff; color: #fff; }

        #challenge-ui {
            position: absolute; top: 25px; left: 20px;
            display: flex; flex-direction: column; gap: 10px; z-index: 200;
        }
        .action-btn {
            background: rgba(100, 220, 255, 0.2); border: 1px solid #64dcff;
            color: #64dcff; padding: 12px 22px; border-radius: 30px;
            cursor: pointer; font-weight: bold; font-size: 14px; letter-spacing: 1px;
            transition: all 0.3s;
        }
        .action-btn:hover { background: #64dcff; color: #01050a; }
        .score-panel { color: #64dcff; font-size: 18px; font-weight: bold; display: none; text-shadow: 0 0 10px rgba(100,220,255,0.5); }
        
        .challenge-actions { display: flex; gap: 10px; }

        #challenge-hint {
            position: absolute; top: 45%; left: 50%;
            transform: translate(-50%, -50%); color: #64dcff;
            font-size: 22px; pointer-events: none; opacity: 0;
            transition: opacity 0.5s; text-align: center; z-index: 50;
            text-shadow: 0 0 20px rgba(100, 220, 255, 0.8);
            line-height: 1.6; width: 85%;
        }
    </style>
</head>
<body>

    <div id="challenge-ui">
        <button id="mode-toggle" class="action-btn" onclick="toggleMode()">開啟聽能定向挑戰</button>
        <div id="score-display" class="score-panel">積分: 0</div>
        <div id="feedback-controls" class="challenge-actions" style="display:none">
            <button class="action-btn" onclick="startReplay()">觀看軌跡複習</button>
            <button class="action-btn" onclick="prepareNextChallenge()">下一題挑戰</button>
        </div>
    </div>

    <div id="challenge-hint">請閉上眼聆聽...</div>

    <div id="scene-controls">
        <button class="scene-btn active" onclick="setScene('bathroom')">清澈水域</button>
        <button class="scene-btn" onclick="setScene('station')">深海大教堂</button>
        <button class="scene-btn" onclick="setScene('cave')">幽暗海洞</button>
        <button class="scene-btn" onclick="setScene('forest')">水下森林</button>
    </div>

    <canvas id="appCanvas"></canvas>

    <script>
        const canvas = document.getElementById('appCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, dpr, centerX, centerY;
        let listenerPlaneY, uiScale, iconSize;

        let audioCtx;
        let convolver, masterDry, masterWet, masterCompressor;
        let currentScene = 'bathroom';
        let noiseBuffer = null;

        const SCENE_CONFIG = {
            bathroom: { main: '#00ccff', bg: '#021020', gridAlpha: 0.05, flow: 1.0, length: 0.5, decay: 12.0, lp: 12000, dry: 0.7, wet: 0.5 },
            station: { main: '#ffaa44', bg: '#150a02', gridAlpha: 0.08, flow: 0.35, length: 5.5, decay: 1.2, lp: 6000, dry: 0.5, wet: 0.7 },
            cave: { main: '#bb66ff', bg: '#0a0215', gridAlpha: 0.04, flow: 0.2, length: 3.5, decay: 2.5, lp: 800, dry: 0.4, wet: 0.8 },
            forest: { main: '#44ffaa', bg: '#02150a', gridAlpha: 0.06, flow: 0.65, length: 2.2, decay: 4.0, lp: 3000, dry: 0.8, wet: 0.3 }
        };

        const WAVE_TYPES = {
            SINE: { id: 'sine', color: '100, 220, 255' },
            TRIANGLE: { id: 'triangle', color: '255, 204, 170' },
            NOISE: { id: 'noise', color: '160, 255, 170' },
            BOATMAN: { id: 'boatman', color: '255, 85, 68' }
        };

        let isChallengeMode = false;
        let challengeState = 'idle'; 
        let totalScore = 0;
        let challengeTarget = null;
        let lastGuessX = 0, lastGuessY = 0;
        let replayIndex = 0;

        let activeObjects = []; 
        let paletteIcons = [];
        const activePointers = new Map();
        
        // --- 視覺強化變數 ---
        let bubbles = [];
        let marineSnow = [];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterCompressor = audioCtx.createDynamicsCompressor();
                masterCompressor.threshold.setTargetAtTime(-24, audioCtx.currentTime, 0.1);
                masterCompressor.connect(audioCtx.destination);
                convolver = audioCtx.createConvolver();
                masterDry = audioCtx.createGain(); masterWet = audioCtx.createGain();
                masterDry.connect(masterCompressor); convolver.connect(masterWet); masterWet.connect(masterCompressor);
                const bufferSize = audioCtx.sampleRate * 2; 
                noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
                applySceneAudio(currentScene);
            }
            if (audioCtx.state !== 'running') audioCtx.resume();
        }

        function applySceneAudio(scene) {
            if (!audioCtx) return;
            const cfg = SCENE_CONFIG[scene];
            const sampleRate = audioCtx.sampleRate;
            const frameCount = Math.floor(sampleRate * cfg.length);
            const buffer = audioCtx.createBuffer(2, frameCount, sampleRate);
            for (let ch = 0; ch < 2; ch++) {
                const data = buffer.getChannelData(ch);
                let lastVal = 0;
                for (let i = 0; i < frameCount; i++) {
                    let t = i / sampleRate;
                    lastVal += 0.1 * ((Math.random() * 2 - 1) - lastVal);
                    data[i] = lastVal * Math.exp(-cfg.decay * t) * 0.45;
                }
            }
            convolver.buffer = buffer;
            const now = audioCtx.currentTime;
            masterDry.gain.setTargetAtTime(cfg.dry, now, 0.15);
            masterWet.gain.setTargetAtTime(cfg.wet, now, 0.15);
        }

        // --- 新增：背景動態設計 ---
        function initBackgroundVisuals() {
            marineSnow = [];
            for(let i=0; i<60; i++) {
                marineSnow.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    s: 0.5 + Math.random() * 1.5,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: 0.2 + Math.random() * 0.5,
                    a: 0.1 + Math.random() * 0.4
                });
            }
        }

        function drawUnderwaterBackground() {
            const cfg = SCENE_CONFIG[currentScene];
            const t = Date.now() * 0.001;
            
            // 基礎深海漸層
            const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
            bgGrad.addColorStop(0, cfg.bg);
            bgGrad.addColorStop(1, '#000000');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // 模擬水面折射光影 (Caustics)
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.strokeStyle = cfg.main + '08';
                ctx.lineWidth = 100 * uiScale;
                const offset = t * (0.5 + i * 0.2);
                ctx.moveTo(-100, height * 0.2 + Math.sin(offset) * 50);
                ctx.bezierCurveTo(
                    width * 0.3, height * 0.1 + Math.cos(offset) * 80,
                    width * 0.7, height * 0.4 + Math.sin(offset) * 80,
                    width + 100, height * 0.2 + Math.cos(offset) * 50
                );
                ctx.stroke();
            }
            ctx.restore();

            // 繪製海雪粒子 (Marine Snow)
            ctx.fillStyle = "#fff";
            marineSnow.forEach(p => {
                p.y += p.vy;
                p.x += p.vx + Math.sin(t + p.y * 0.01) * 0.2;
                if (p.y > height) p.y = -10;
                if (p.x > width) p.x = 0; else if (p.x < 0) p.x = width;
                ctx.globalAlpha = p.a;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        // --- 現有的核心功能 (保持標題與邏輯) ---
        window.toggleMode = () => {
            initAudio(); 
            isChallengeMode = !isChallengeMode;
            const btn = document.getElementById('mode-toggle');
            const scoreDisplay = document.getElementById('score-display');
            const fbUI = document.getElementById('feedback-controls');
            const hint = document.getElementById('challenge-hint');
            activeObjects.forEach(obj => obj.cleanup());
            activeObjects = [];
            if (challengeTarget) { challengeTarget.cleanup(); challengeTarget = null; }
            fbUI.style.display = "none";
            totalScore = 0;
            scoreDisplay.innerText = `積分: ${totalScore}`;
            if (isChallengeMode) {
                btn.innerText = "退出訓練模式";
                scoreDisplay.style.display = "block";
                challengeState = 'preparing';
                hint.innerHTML = "準備好了嗎？<br><span style='font-size:16px; color:#fff'>點擊畫面任何地方開始聽能定向挑戰</span>";
                hint.style.opacity = 1;
            } else {
                btn.innerText = "開啟聽能定向挑戰";
                scoreDisplay.style.display = "none";
                hint.style.opacity = 0;
                challengeState = 'idle';
            }
        };

        function startNewChallenge() {
            challengeState = 'listening';
            document.getElementById('feedback-controls').style.display = "none";
            const hint = document.getElementById('challenge-hint');
            hint.innerHTML = "請閉上眼聆聽聲音移動...";
            hint.style.opacity = 1;
            const randomType = Object.values(WAVE_TYPES)[Math.floor(Math.random() * 4)];
            const safeX = width * 0.25; const safeY = height * 0.25;
            const rx = safeX + Math.random() * (width - safeX * 2);
            const ry = safeY + Math.random() * (height - safeY * 2);
            challengeTarget = new DraggableSound(randomType, rx, ry);
            challengeTarget.isChallengeObject = true;
            challengeTarget.trajectory = []; 
            challengeTarget.moveDuration = 3500 + Math.random() * 2000;
            challengeTarget.startTime = Date.now();
            const angleStart = Math.random() * Math.PI * 2;
            const angleSpeed = (Math.random() - 0.5) * 0.05;
            const radius = 80 + Math.random() * 100 * uiScale;
            challengeTarget.updateCustomPath = function() {
                const elapsed = Date.now() - this.startTime;
                if (elapsed < this.moveDuration) {
                    this.x = rx + Math.cos(angleStart + angleSpeed * elapsed * 0.05) * radius;
                    this.y = ry + Math.sin(angleStart + angleSpeed * elapsed * 0.05) * radius;
                    this.trajectory.push({x: this.x, y: this.y});
                    this.updatePanner();
                    if (Math.random() > 0.8) createBubble(this.x, this.y, this.rgb);
                } else {
                    challengeState = 'waiting_for_guess';
                    this.muteChallenge();
                    hint.innerHTML = "聲音已停止<br><span style='font-size:16px; color:#fff'>請點擊聲源最後消失的位置</span>";
                }
            };
            challengeTarget.play();
        }

        // --- 氣泡粒子系統 ---
        function createBubble(x, y, rgb) {
            bubbles.push({
                x: x, y: y,
                r: 2 + Math.random() * 4,
                vx: (Math.random() - 0.5) * 2,
                vy: -1 - Math.random() * 3,
                life: 1.0,
                color: rgb
            });
        }

        function drawBubbles() {
            bubbles.forEach((b, i) => {
                b.x += b.vx; b.y += b.vy; b.life -= 0.02;
                if (b.life <= 0) bubbles.splice(i, 1);
                ctx.beginPath();
                ctx.strokeStyle = `rgba(${b.color}, ${b.life * 0.5})`;
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.stroke();
            });
        }

        // --- 核心類別與繪圖 (延續先前邏輯) ---
        class DraggableSound {
            constructor(typeConfig, x, y) {
                this.type = typeConfig.id; this.rgb = typeConfig.color; this.x = x; this.y = y;
                this.smoothedX = x; this.smoothedY = y;
                this.isDragging = false; this.isFading = false; this.isChallengeObject = false; 
                this.life = 1.0; this.pulse = 0; this.trajectory = [];
                this.source = null; this.gain = null; this.panner = null;
            }
            play() {
                if (!audioCtx) return; const now = audioCtx.currentTime;
                this.gain = audioCtx.createGain(); this.panner = audioCtx.createPanner();
                this.panner.panningModel = 'HRTF';
                if (this.type === 'sine' || this.type === 'triangle') {
                    this.source = audioCtx.createOscillator(); this.source.type = this.type;
                } else {
                    this.source = audioCtx.createBufferSource(); this.source.buffer = noiseBuffer; this.source.loop = true;
                }
                this.source.connect(this.panner); this.panner.connect(this.gain);
                this.gain.connect(masterDry); this.gain.connect(convolver);
                this.updatePanner(true);
                this.gain.gain.setTargetAtTime(0.4, now, 0.1);
                this.source.start(now);
            }
            updatePanner() {
                if (!this.panner) return;
                const now = audioCtx.currentTime;
                const posX = (this.smoothedX / width) * 6 - 3;
                const posZ = ((this.smoothedY - listenerPlaneY) / height) * 5;
                this.panner.positionX.setTargetAtTime(posX, now, 0.1);
                this.panner.positionZ.setTargetAtTime(posZ, now, 0.1);
            }
            muteChallenge() { if(this.gain) this.gain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5); }
            cleanup() { if(this.source) try { this.source.stop(); } catch(e) {} }
            update() {
                this.pulse += 0.08;
                if (this.isDragging) {
                    this.smoothedX += (this.x - this.smoothedX) * 0.2;
                    this.smoothedY += (this.y - this.smoothedY) * 0.2;
                    this.updatePanner();
                    if (Math.random() > 0.7) createBubble(this.x, this.y, this.rgb);
                } else if (this.isChallengeObject && challengeState === 'listening') {
                    this.updateCustomPath();
                }
                if (this.isFading) {
                    this.life -= 0.01; if (this.life <= 0) { this.cleanup(); activeObjects = activeObjects.filter(o => o !== this); }
                }
            }
            draw(ctx) {
                if (this.isChallengeObject && (challengeState === 'listening' || challengeState === 'waiting_for_guess')) return;
                drawGeometry(ctx, this.type, this.x, this.y, 28 * uiScale, this.rgb, this.life, this.pulse);
            }
        }

        // --- 繪圖工具 ---
        function drawGeometry(ctx, type, x, y, baseSize, rgbStr, alpha, pulse) {
            ctx.save();
            ctx.translate(x, y);
            const s = baseSize * (1 + Math.sin(pulse) * 0.1);
            ctx.shadowBlur = 15; ctx.shadowColor = `rgba(${rgbStr}, 0.5)`;
            ctx.fillStyle = `rgba(${rgbStr}, ${alpha * 0.8})`;
            ctx.beginPath();
            if (type === 'sine') ctx.arc(0, 0, s, 0, Math.PI * 2);
            else if (type === 'triangle') { ctx.moveTo(0, -s); ctx.lineTo(s, s); ctx.lineTo(-s, s); ctx.closePath(); }
            else { ctx.rect(-s/2, -s/2, s, s); }
            ctx.fill();
            ctx.restore();
        }

        // --- 介面控制 ---
        function setScene(scene) { initAudio(); currentScene = scene; document.querySelectorAll('.scene-btn').forEach(btn => btn.classList.remove('active')); event.target.classList.add('active'); applySceneAudio(scene); }

        function initLayout() {
            dpr = window.devicePixelRatio || 1; width = window.innerWidth; height = window.innerHeight;
            canvas.width = width * dpr; canvas.height = height * dpr; canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
            ctx.scale(dpr, dpr); centerX = width / 2; centerY = height / 2; listenerPlaneY = height * 0.55; 
            uiScale = Math.min(1.0, width / 1000) + 0.5; iconSize = 30;
            const paletteX = width - 50;
            paletteIcons = [
                { typeConfig: WAVE_TYPES.SINE, x: paletteX, y: height * 0.2 },
                { typeConfig: WAVE_TYPES.TRIANGLE, x: paletteX, y: height * 0.35 },
                { typeConfig: WAVE_TYPES.NOISE, x: paletteX, y: height * 0.5 },
                { typeConfig: WAVE_TYPES.BOATMAN, x: paletteX, y: height * 0.65 }
            ];
            initBackgroundVisuals();
        }

        function animate() {
            drawUnderwaterBackground();
            drawBubbles();
            if (!isChallengeMode) {
                paletteIcons.forEach(p => drawGeometry(ctx, p.typeConfig.id, p.x, p.y, iconSize, p.typeConfig.color, 0.9, Date.now()*0.002));
            }
            activeObjects.forEach(obj => { obj.update(); obj.draw(ctx); });
            if (challengeTarget) {
                challengeTarget.update(); challengeTarget.draw(ctx);
                if (challengeState === 'feedback') {
                    ctx.beginPath(); ctx.strokeStyle = "#ff4444"; ctx.moveTo(centerX, centerY); ctx.lineTo(challengeTarget.x, challengeTarget.y); ctx.stroke();
                }
            }
            requestAnimationFrame(animate);
        }

        // --- 事件監聽 ---
        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('button') || e.target.closest('#scene-controls')) return;
            initAudio();
            const pt = { x: e.clientX, y: e.clientY };
            if (isChallengeMode && challengeState === 'preparing') { startNewChallenge(); return; }
            if (isChallengeMode && challengeState === 'waiting_for_guess') { handleChallengeGuess(pt.x, pt.y); return; }
            
            paletteIcons.forEach(p => {
                if (Math.sqrt((pt.x-p.x)**2 + (pt.y-p.y)**2) < 40) {
                    const n = new DraggableSound(p.typeConfig, pt.x, pt.y);
                    n.isDragging = true; n.pointerId = e.pointerId;
                    activeObjects.push(n); activePointers.set(e.pointerId, n);
                    n.play();
                }
            });
        });

        window.addEventListener('pointermove', (e) => {
            const obj = activePointers.get(e.pointerId);
            if (obj) { obj.x = e.clientX; obj.y = e.clientY; }
        });

        window.addEventListener('pointerup', (e) => {
            const obj = activePointers.get(e.pointerId);
            if (obj) { obj.isDragging = false; obj.isFading = true; activePointers.delete(e.pointerId); }
        });

        window.addEventListener('resize', initLayout);
        initLayout();
        animate();

        // 輔助函式
        function startReplay() { /* 邏輯同前 */ }
        function prepareNextChallenge() { /* 邏輯同前 */ }
        function handleChallengeGuess(x, y) {
            challengeState = 'feedback'; lastGuessX = x; lastGuessY = y;
            document.getElementById('feedback-controls').style.display = "flex";
            challengeTarget.life = 1.0;
        }
    </script>
</body>
</html>
