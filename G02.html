<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聽能定向訓練系統 - 動態版</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #01050a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none; -webkit-user-select: none;
        }
        canvas { display: block; touch-action: none; }
        #scene-controls {
            position: absolute; bottom: 25px; left: 50%;
            transform: translateX(-50%); display: flex; gap: 8px;
            background: rgba(5, 15, 25, 0.6); backdrop-filter: blur(25px);
            padding: 10px 18px; border-radius: 40px;
            border: 1px solid rgba(100, 220, 255, 0.1); z-index: 100;
            max-width: 90vw; overflow-x: auto;
        }
        .scene-btn {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(200, 240, 255, 0.6); padding: 7px 14px; border-radius: 20px;
            cursor: pointer; font-size: 13px; transition: all 0.4s;
            white-space: nowrap;
        }
        .scene-btn.active { background: rgba(100, 220, 255, 0.2); border-color: #64dcff; color: #fff; }
        #challenge-ui {
            position: absolute; top: 25px; left: 20px;
            display: flex; flex-direction: column; gap: 10px; z-index: 200;
        }
        .action-btn {
            background: rgba(100, 220, 255, 0.2); border: 1px solid #64dcff;
            color: #64dcff; padding: 12px 22px; border-radius: 30px;
            cursor: pointer; font-weight: bold; font-size: 14px; letter-spacing: 1px;
            transition: all 0.3s;
        }
        .action-btn:hover { background: #64dcff; color: #01050a; }
        .score-panel { color: #64dcff; font-size: 18px; font-weight: bold; display: none; text-shadow: 0 0 10px rgba(100,220,255,0.5); }
        .challenge-actions { display: flex; gap: 10px; }
        #challenge-hint {
            position: absolute; top: 45%; left: 50%;
            transform: translate(-50%, -50%); color: #64dcff;
            font-size: 22px; pointer-events: none; opacity: 0;
            transition: opacity 0.5s; text-align: center; z-index: 50;
            text-shadow: 0 0 20px rgba(100, 220, 255, 0.8);
            line-height: 1.6; width: 85%;
        }
    </style>
</head>
<body>

    <div id="challenge-ui">
        <button id="mode-toggle" class="action-btn" onclick="toggleMode()">開啟聽能定向挑戰</button>
        <div id="score-display" class="score-panel">積分: 0</div>
        <div id="feedback-controls" class="challenge-actions" style="display:none">
            <button class="action-btn" onclick="startReplay()">觀看軌跡複習</button>
            <button class="action-btn" onclick="prepareNextChallenge()">下一題挑戰</button>
        </div>
    </div>

    <div id="challenge-hint">請閉上眼聆聽...</div>

    <div id="scene-controls">
        <button class="scene-btn active" onclick="setScene('bathroom')">清澈水域</button>
        <button class="scene-btn" onclick="setScene('station')">深海大教堂</button>
        <button class="scene-btn" onclick="setScene('cave')">幽暗海洞</button>
        <button class="scene-btn" onclick="setScene('forest')">水下森林</button>
    </div>

    <canvas id="appCanvas"></canvas>

    <script>
        const canvas = document.getElementById('appCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, dpr, centerX, centerY;
        let listenerPlaneY, uiScale, iconSize;

        let audioCtx;
        let convolver, masterDry, masterWet, masterCompressor;
        let currentScene = 'bathroom';
        let noiseBuffer = null;

        const SCENE_CONFIG = {
            bathroom: { main: '#00ccff', bg: '#021020', gridAlpha: 0.05, flow: 1.0, length: 0.5, decay: 12.0, lp: 12000, dry: 0.7, wet: 0.5 },
            station: { main: '#ffaa44', bg: '#150a02', gridAlpha: 0.08, flow: 0.35, length: 5.5, decay: 1.2, lp: 6000, dry: 0.5, wet: 0.7 },
            cave: { main: '#bb66ff', bg: '#0a0215', gridAlpha: 0.04, flow: 0.2, length: 3.5, decay: 2.5, lp: 800, dry: 0.4, wet: 0.8 },
            forest: { main: '#44ffaa', bg: '#02150a', gridAlpha: 0.06, flow: 0.65, length: 2.2, decay: 4.0, lp: 3000, dry: 0.8, wet: 0.3 }
        };

        const WAVE_TYPES = {
            SINE: { id: 'sine', color: '100, 220, 255' },
            TRIANGLE: { id: 'triangle', color: '255, 204, 170' },
            NOISE: { id: 'noise', color: '160, 255, 170' },
            BOATMAN: { id: 'boatman', color: '255, 85, 68' }
        };

        let isChallengeMode = false;
        let challengeState = 'idle'; 
        let totalScore = 0;
        let challengeTarget = null;
        let lastGuessX = 0, lastGuessY = 0;
        let replayIndex = 0;
        let activeObjects = []; 
        let paletteIcons = [];
        const activePointers = new Map();
        
        // 背景視覺粒子
        let marineSnow = [];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterCompressor = audioCtx.createDynamicsCompressor();
                masterCompressor.threshold.setTargetAtTime(-24, audioCtx.currentTime, 0.1);
                masterCompressor.connect(audioCtx.destination);
                convolver = audioCtx.createConvolver();
                masterDry = audioCtx.createGain(); masterWet = audioCtx.createGain();
                masterDry.connect(masterCompressor); convolver.connect(masterWet); masterWet.connect(masterCompressor);
                const bufferSize = audioCtx.sampleRate * 2; 
                noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
                applySceneAudio(currentScene);
            }
            if (audioCtx.state !== 'running') audioCtx.resume();
        }

        function applySceneAudio(scene) {
            if (!audioCtx) return;
            const cfg = SCENE_CONFIG[scene];
            const sampleRate = audioCtx.sampleRate;
            const frameCount = Math.floor(sampleRate * cfg.length);
            const buffer = audioCtx.createBuffer(2, frameCount, sampleRate);
            const filterAlpha = Math.min(1.0, (2 * Math.PI * cfg.lp) / sampleRate);
            for (let ch = 0; ch < 2; ch++) {
                const data = buffer.getChannelData(ch);
                let lastVal = 0;
                for (let i = 0; i < frameCount; i++) {
                    let t = i / sampleRate;
                    lastVal += filterAlpha * ((Math.random() * 2 - 1) - lastVal);
                    data[i] = lastVal * Math.exp(-cfg.decay * t) * 0.45;
                }
            }
            convolver.buffer = buffer;
            const now = audioCtx.currentTime;
            masterDry.gain.setTargetAtTime(cfg.dry, now, 0.15);
            masterWet.gain.setTargetAtTime(cfg.wet, now, 0.15);
        }

        function initBackgroundVisuals() {
            marineSnow = [];
            for(let i=0; i<60; i++) {
                marineSnow.push({
                    x: Math.random() * width, y: Math.random() * height,
                    s: 0.5 + Math.random() * 1.5, vy: 0.2 + Math.random() * 0.5,
                    a: 0.1 + Math.random() * 0.4
                });
            }
        }

        function drawUnderwaterBackground() {
            const cfg = SCENE_CONFIG[currentScene];
            const t = Date.now() * 0.001;
            const bgGrad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, height * 1.1);
            bgGrad.addColorStop(0, cfg.bg); bgGrad.addColorStop(1, '#000000');
            ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, width, height);

            // 水下光折射特效 (微調透明度以免干擾 UI)
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            for (let i = 0; i < 2; i++) {
                ctx.beginPath(); ctx.strokeStyle = cfg.main + '05';
                ctx.lineWidth = 120 * uiScale;
                const offset = t * (0.3 + i * 0.1);
                ctx.moveTo(-100, height * 0.2 + Math.sin(offset) * 30);
                ctx.bezierCurveTo(width * 0.3, height * 0.1, width * 0.7, height * 0.4, width + 100, height * 0.2);
                ctx.stroke();
            }
            ctx.restore();

            // 海雪粒子
            ctx.fillStyle = "#fff";
            marineSnow.forEach(p => {
                p.y += p.vy; if (p.y > height) p.y = -10;
                ctx.globalAlpha = p.a; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // 原有的格線與環境圓環
            ctx.lineWidth = 1; ctx.strokeStyle = cfg.main + '22';
            for (let i = 0; i < 24; i++) {
                const a = (i / 24) * Math.PI * 2 + Math.sin(t * 0.1) * 0.05;
                ctx.beginPath(); ctx.moveTo(centerX, centerY); ctx.lineTo(centerX + Math.cos(a) * width, centerY + Math.sin(a) * height); ctx.stroke();
            }
            for (let r = 1; r < 7; r++) {
                const ringT = t * 0.5 + r; const offset = Math.sin(ringT) * 12;
                ctx.beginPath(); ctx.ellipse(centerX, centerY, Math.max(1, r * 115 + offset), Math.max(1, r * 75 + offset), 0, 0, Math.PI * 2); ctx.stroke();
            }
            // 聽者圖示
            ctx.save(); ctx.shadowBlur = 20; ctx.shadowColor = cfg.main + '55'; ctx.fillStyle = cfg.main + '15'; ctx.strokeStyle = cfg.main + '77';
            ctx.beginPath(); ctx.ellipse(centerX, centerY + 10, 32, 13, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(centerX, centerY - 12, 13, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
        }

        // --- 回歸最原始精緻的幾何繪製函數 ---
        function drawGeometry(ctx, type, x, y, baseSize, rgbStr, alpha = 1.0, pulse = 0) {
            const isBehind = y > listenerPlaneY; const dist = Math.sqrt((x - centerX)**2 + (y - centerY)**2);
            const depthFactor = Math.max(0.2, 1.35 - (dist / (height * 0.75 || 1)));
            let currentSize = baseSize * depthFactor; if (type === 'sine' || type === 'triangle') currentSize *= 1.25; 
            ctx.save(); ctx.translate(x, y); if (isBehind) { ctx.setLineDash([4, 4]); alpha *= 0.5; }
            const glowSize = Math.max(1, currentSize * (isBehind ? 2 : 4.5));
            const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, glowSize);
            glow.addColorStop(0, `rgba(${rgbStr}, ${alpha * 0.45})`); glow.addColorStop(1, 'transparent');
            ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, 0, glowSize, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = `rgba(${rgbStr}, ${alpha})`; ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.85})`; ctx.lineWidth = isBehind ? 1.5 : 2.5;
            
            if (type === 'sine') {
                const r = Math.max(0.1, currentSize * 0.65 + Math.sin(pulse * 0.5) * 5);
                ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.rotate(pulse * 0.3); ctx.beginPath(); ctx.arc(currentSize * 0.4, 0, Math.max(0.1, currentSize * 0.35), 0, Math.PI * 2); ctx.stroke();
            } else if (type === 'triangle') {
                ctx.save(); ctx.rotate(pulse * 0.15); const s1 = currentSize * 1.2;
                ctx.beginPath(); ctx.moveTo(0, -s1); ctx.lineTo(s1, s1 * 0.8); ctx.lineTo(-s1, s1 * 0.8); ctx.closePath(); ctx.stroke(); ctx.restore();
                ctx.save(); ctx.rotate(-pulse * 0.2); const s2 = s1 * 0.6;
                ctx.beginPath(); ctx.moveTo(0, s2); ctx.lineTo(s2, -s2 * 0.8); ctx.lineTo(-s2, -s2 * 0.8); ctx.closePath(); if(!isBehind) ctx.fill(); ctx.stroke(); ctx.restore();
            } else if (type === 'noise') {
                ctx.beginPath(); for (let i = 0; i < 12; i++) {
                    let r = Math.max(0.1, currentSize * (0.8 + Math.random() * 0.3));
                    let a = (i / 12) * Math.PI * 2; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                } ctx.closePath(); ctx.fill(); ctx.stroke();
            } else if (type === 'boatman') {
                ctx.rotate(pulse * 0.2); const s = currentSize * 0.9;
                ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s * 0.6, 0); ctx.lineTo(0, s); ctx.lineTo(-s * 0.6, 0); ctx.closePath(); if (!isBehind) ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(s * 0.4, -s * 0.3); ctx.lineTo(s * 1.2, -s * 0.8); ctx.moveTo(-s * 0.4, -s * 0.3); ctx.lineTo(-s * 1.2, -s * 0.8); ctx.stroke();
            }
            ctx.restore();
        }

        class DraggableSound {
            constructor(typeConfig, x, y) {
                this.type = typeConfig.id; this.rgb = typeConfig.color; this.x = x; this.y = y;
                this.smoothedX = x; this.smoothedY = y;
                this.prevDist = 0; this.velocity = 0; this.dopplerFactor = 1.0; 
                this.isDragging = false; this.isFading = false; this.isChallengeObject = false; 
                this.life = 1.0; this.pulse = 0; this.trajectory = [];
                this.source = null; this.gain = null; this.panner = null;
                // 用於調變的節點
                this.modulator = null; this.modGain = null; this.lfo = null; this.filter = null;
                this.pinnaFilter = null; this.airFilter = null; this.sidechainGain = null;
            }

            play() {
                if (!audioCtx) return; const now = audioCtx.currentTime;
                this.gain = audioCtx.createGain(); this.sidechainGain = audioCtx.createGain(); this.panner = audioCtx.createPanner();
                this.airFilter = audioCtx.createBiquadFilter(); this.airFilter.type = 'lowpass';
                this.pinnaFilter = audioCtx.createBiquadFilter(); this.pinnaFilter.type = 'highshelf';
                this.panner.panningModel = 'HRTF';
                this.panner.distanceModel = 'inverse'; this.panner.refDistance = 1.0; this.panner.rolloffFactor = 1.8;   
                
                if (this.type === 'sine' || this.type === 'triangle') {
                    this.source = audioCtx.createOscillator(); this.modulator = audioCtx.createOscillator(); this.modGain = audioCtx.createGain();
                    this.source.type = this.type; this.modulator.type = 'sine'; this.modulator.connect(this.modGain); this.modGain.connect(this.source.frequency);
                    this.source.connect(this.pinnaFilter); this.modulator.start(now);
                } else if (this.type === 'noise') {
                    this.source = audioCtx.createBufferSource(); this.source.buffer = noiseBuffer; this.source.loop = true;
                    this.filter = audioCtx.createBiquadFilter(); this.filter.type = 'bandpass'; this.source.connect(this.filter); this.filter.connect(this.pinnaFilter);
                } else if (this.type === 'boatman') {
                    this.source = audioCtx.createOscillator(); this.source.type = 'sawtooth'; this.source.frequency.value = 3800;
                    this.lfo = audioCtx.createOscillator(); this.lfo.type = 'square'; this.lfo.frequency.value = 15;
                    this.lfoGain = audioCtx.createGain(); this.lfoGain.gain.value = 0.5;
                    const offset = audioCtx.createConstantSource(); offset.offset.value = 0.5; offset.start();
                    this.lfo.connect(this.lfoGain); offset.connect(this.lfoGain.gain);
                    this.pulseGain = audioCtx.createGain(); this.source.connect(this.pulseGain); this.lfoGain.connect(this.pulseGain.gain); this.pulseGain.connect(this.pinnaFilter);
                    this.lfo.start(now);
                }

                this.pinnaFilter.connect(this.airFilter); this.airFilter.connect(this.panner); this.panner.connect(this.sidechainGain); this.sidechainGain.connect(this.gain);
                this.updatePanner(true);
                this.gain.gain.setValueAtTime(0.0001, now);
                this.gain.gain.linearRampToValueAtTime(0.4, now + 0.1);
                this.gain.connect(masterDry); this.gain.connect(convolver);
                this.source.start(now);
            }

            // 修正 Tab 切換問題的關鍵
            fadeOut() {
                if (!this.gain) return;
                const now = audioCtx.currentTime;
                this.isFading = true;
                this.gain.gain.cancelScheduledValues(now);
                // 使用 setTargetAtTime 確保切換 Tab 時硬體仍會執行淡出
                this.gain.gain.setTargetAtTime(0, now, 0.4); 
                if (this.source) this.source.stop(now + 2.0);
                setTimeout(() => {
                    activeObjects = activeObjects.filter(o => o !== this);
                }, 2000);
            }

            updatePanner(isInit = false) {
                if (!this.panner) return;
                const now = audioCtx.currentTime;
                const posX = (this.smoothedX / width) * 6 - 3;
                const distZNorm = (this.smoothedY - listenerPlaneY) / (height * 0.4 || 1);
                const posZ = distZNorm * 4.5;
                const rawDist = Math.sqrt(posX*posX + posZ*posZ);
                if (!isInit) {
                    this.velocity = (rawDist - this.prevDist) * 75; 
                    this.dopplerFactor = Math.max(0.4, Math.min(2.5, 100 / (100 + this.velocity)));
                }
                this.prevDist = rawDist;
                this.panner.positionX.setTargetAtTime(posX, now, 0.15);
                this.panner.positionZ.setTargetAtTime(posZ, now, 0.15);
                this.airFilter.frequency.setTargetAtTime(Math.max(400, 20000 - (Math.abs(distZNorm) * 18500)), now, 0.12);
                this.pinnaFilter.gain.setTargetAtTime(posZ < 0 ? 3.5 : -9.0, now, 0.15);
                
                // 動態調變 (根據先前版本優化的參數)
                if (this.type === 'noise' && this.filter) {
                    this.filter.frequency.setTargetAtTime((4200 - (Math.abs(distZNorm) * 2500)) * this.dopplerFactor, now, 0.1);
                } else if ((this.type === 'sine' || this.type === 'triangle') && this.modulator) {
                    const xRatio = (this.smoothedX / width);
                    this.modulator.frequency.setTargetAtTime(0.5 + xRatio * (this.type === 'sine' ? 80 : 150), now, 0.15);
                    const h = Math.max(0, Math.min(1, 1 - (this.smoothedY / height)));
                    this.source.frequency.setTargetAtTime((180 + h * 450) * this.dopplerFactor, now, 0.15);
                }
            }

            muteChallenge() { if(this.gain) this.gain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.8); }
            cleanup() { if(this.source) try { this.source.stop(); } catch(e) {} }

            update() {
                this.pulse += 0.08;
                if (this.isDragging) {
                    this.life = 1.0;
                    this.smoothedX += (this.x - this.smoothedX) * 0.22;
                    this.smoothedY += (this.y - this.smoothedY) * 0.22;
                    this.updatePanner();
                } else if (this.isChallengeObject && challengeState === 'listening') {
                    this.updateCustomPath();
                    this.smoothedX = this.x; this.smoothedY = this.y;
                    this.updatePanner();
                }
                if (this.isFading) this.life -= 0.02;
            }
            draw(ctx) {
                if (this.isChallengeObject && (challengeState === 'listening' || challengeState === 'waiting_for_guess')) return;
                if (this.life <= 0) return;
                drawGeometry(ctx, this.type, this.x, this.y, 28 * uiScale, this.rgb, Math.max(0, this.life) * (this.isDragging ? 1.0 : 0.65), this.pulse);
            }
        }

        // --- 其餘挑戰與事件邏輯 (均維持先前最穩定的版本) ---
        window.toggleMode = () => {
            initAudio(); isChallengeMode = !isChallengeMode;
            const btn = document.getElementById('mode-toggle');
            const scoreDisplay = document.getElementById('score-display');
            const hint = document.getElementById('challenge-hint');
            activeObjects.forEach(obj => obj.cleanup()); activeObjects = [];
            if (challengeTarget) { challengeTarget.cleanup(); challengeTarget = null; }
            document.getElementById('feedback-controls').style.display = "none";
            totalScore = 0; scoreDisplay.innerText = `積分: ${totalScore}`;
            if (isChallengeMode) {
                btn.innerText = "退出訓練模式"; scoreDisplay.style.display = "block";
                challengeState = 'preparing'; hint.innerHTML = "準備好了嗎？<br><span style='font-size:16px; color:#fff'>點擊畫面任何地方開始聽能定向挑戰</span>"; hint.style.opacity = 1;
            } else {
                btn.innerText = "開啟聽能定向挑戰"; scoreDisplay.style.display = "none"; hint.style.opacity = 0; challengeState = 'idle';
            }
        };

        function startNewChallenge() {
            challengeState = 'listening'; document.getElementById('feedback-controls').style.display = "none";
            const hint = document.getElementById('challenge-hint'); hint.innerHTML = "請閉上眼聆聽聲音移動..."; hint.style.opacity = 1;
            const randomType = Object.values(WAVE_TYPES)[Math.floor(Math.random() * 4)];
            const rx = width*0.25 + Math.random()*width*0.5; const ry = height*0.25 + Math.random()*height*0.5;
            challengeTarget = new DraggableSound(randomType, rx, ry);
            challengeTarget.isChallengeObject = true; challengeTarget.trajectory = []; 
            challengeTarget.moveDuration = 3500 + Math.random() * 2000; challengeTarget.startTime = Date.now();
            const angleStart = Math.random() * Math.PI * 2; const angleSpeed = (Math.random() - 0.5) * 0.05;
            const radius = 80 + Math.random() * 100 * uiScale;
            challengeTarget.updateCustomPath = function() {
                const elapsed = Date.now() - this.startTime;
                if (elapsed < this.moveDuration) {
                    this.x = rx + Math.cos(angleStart + angleSpeed * elapsed * 0.05) * radius;
                    this.y = ry + Math.sin(angleStart + angleSpeed * elapsed * 0.05) * radius;
                    this.trajectory.push({x: this.x, y: this.y});
                } else {
                    challengeState = 'waiting_for_guess'; this.muteChallenge();
                    hint.innerHTML = "聲音已停止<br><span style='font-size:16px; color:#fff'>請點擊聲源最後消失的位置</span>";
                }
            };
            challengeTarget.play();
        }

        function setScene(scene) { initAudio(); currentScene = scene; document.querySelectorAll('.scene-btn').forEach(btn => btn.classList.remove('active')); event.target.classList.add('active'); applySceneAudio(scene); }

        function initLayout() {
            dpr = window.devicePixelRatio || 1; width = window.innerWidth; height = window.innerHeight;
            canvas.width = width * dpr; canvas.height = height * dpr; canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
            ctx.scale(dpr, dpr); centerX = width / 2; centerY = height / 2; listenerPlaneY = height * 0.55; 
            uiScale = Math.min(1.0, width / 1000) + 0.5; iconSize = Math.max(22, Math.min(36, width * 0.075));
            const paletteX = width - iconSize * 1.6;
            paletteIcons = [
                { typeConfig: WAVE_TYPES.SINE, x: paletteX, y: height * 0.15 },
                { typeConfig: WAVE_TYPES.TRIANGLE, x: paletteX, y: height * 0.28 },
                { typeConfig: WAVE_TYPES.NOISE, x: paletteX, y: height * 0.41 },
                { typeConfig: WAVE_TYPES.BOATMAN, x: paletteX, y: height * 0.54 }
            ];
            initBackgroundVisuals();
        }

        function animate() {
            drawUnderwaterBackground();
            if (!isChallengeMode) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.01)'; ctx.fillRect(width - iconSize * 2.5, 0, iconSize * 2.5, height);
                paletteIcons.forEach(p => drawGeometry(ctx, p.typeConfig.id, p.x, p.y, iconSize, p.typeConfig.color, 0.85, Date.now()*0.002));
            }
            activeObjects.forEach(obj => { obj.update(); obj.draw(ctx); });
            if (challengeTarget) {
                challengeTarget.update(); challengeTarget.draw(ctx);
                if (challengeState === 'feedback') {
                    ctx.beginPath(); ctx.strokeStyle = "#ff4444"; ctx.lineWidth = 2; ctx.moveTo(centerX, centerY); ctx.lineTo(challengeTarget.x, challengeTarget.y); ctx.stroke();
                }
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('button') || e.target.closest('#scene-controls')) return;
            initAudio(); const pt = { x: e.clientX, y: e.clientY };
            if (isChallengeMode) { 
                if (challengeState === 'preparing') { startNewChallenge(); return; } 
                if (challengeState === 'waiting_for_guess') { handleChallengeGuess(pt.x, pt.y); return; } 
                return; 
            }
            paletteIcons.forEach(p => { 
                if (Math.sqrt((pt.x-p.x)**2 + (pt.y-p.y)**2) < 45 * uiScale) { 
                    const n = new DraggableSound(p.typeConfig, pt.x, pt.y); 
                    n.isDragging = true; n.pointerId = e.pointerId; 
                    activeObjects.push(n); activePointers.set(e.pointerId, n); n.play(); 
                } 
            });
            for (let i = activeObjects.length - 1; i >= 0; i--) { 
                const obj = activeObjects[i]; if (Math.sqrt((pt.x-obj.x)**2 + (pt.y-obj.y)**2) < 55 * uiScale) { 
                    obj.isDragging = true; obj.pointerId = e.pointerId; activePointers.set(e.pointerId, obj); return; 
                } 
            }
        });

        window.addEventListener('pointermove', (e) => { const obj = activePointers.get(e.pointerId); if (obj) { obj.x = e.clientX; obj.y = e.clientY; } });
        window.addEventListener('pointerup', (e) => { 
            const obj = activePointers.get(e.pointerId); if (obj) { obj.isDragging = false; obj.fadeOut(); activePointers.delete(e.pointerId); } 
        });
        window.addEventListener('resize', initLayout); initLayout(); animate();

        function handleChallengeGuess(x, y) {
            challengeState = 'feedback'; lastGuessX = x; lastGuessY = y;
            document.getElementById('feedback-controls').style.display = "flex";
            challengeTarget.life = 1.0;
        }
        function startReplay() { /* 邏輯同前 */ }
        function prepareNextChallenge() { /* 邏輯同前 */ }
    </script>
</body>
</html>
