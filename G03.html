<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聽能定向訓練系統 - 12方位定點版</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #01050a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none; -webkit-user-select: none;
        }
        canvas { display: block; touch-action: none; }

        /* 場景與半徑控制列 */
        #controls-container {
            position: absolute; bottom: 25px; left: 50%;
            transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px;
            align-items: center; z-index: 100; max-width: 95vw;
        }
        .control-group {
            display: flex; gap: 8px; background: rgba(5, 15, 25, 0.6);
            backdrop-filter: blur(25px); padding: 8px 15px; border-radius: 40px;
            border: 1px solid rgba(100, 220, 255, 0.1); overflow-x: auto;
        }
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(200, 240, 255, 0.6); padding: 7px 14px; border-radius: 20px;
            cursor: pointer; font-size: 13px; transition: all 0.3s; white-space: nowrap;
        }
        .ctrl-btn.active { background: rgba(100, 220, 255, 0.2); border-color: #64dcff; color: #fff; text-shadow: 0 0 8px rgba(100,220,255,0.5); }

        /* 挑戰介面 */
        #challenge-ui {
            position: absolute; top: 25px; left: 20px;
            display: flex; flex-direction: column; gap: 10px; z-index: 200;
        }
        .action-btn {
            background: rgba(100, 220, 255, 0.15); border: 1px solid #64dcff;
            color: #64dcff; padding: 12px 22px; border-radius: 30px;
            cursor: pointer; font-weight: bold; font-size: 14px; letter-spacing: 1px;
            transition: all 0.3s; box-shadow: 0 0 15px rgba(100, 220, 255, 0.1);
        }
        .action-btn:hover { background: #64dcff; color: #01050a; }
        .score-panel { color: #64dcff; font-size: 18px; font-weight: bold; display: none; text-shadow: 0 0 10px rgba(100,220,255,0.5); }
        .round-panel { color: #fff; font-size: 14px; display: none; opacity: 0.8; }
        
        .challenge-actions { display: flex; gap: 10px; }

        /* 中央提示文字 */
        #center-hint {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-size: 24px; pointer-events: none; opacity: 0;
            transition: opacity 0.5s; text-align: center; z-index: 50;
            text-shadow: 0 0 20px rgba(100, 220, 255, 0.8); line-height: 1.6; width: 85%;
        }
        .feedback-score { font-size: 32px; font-weight: bold; color: #64dcff; margin-bottom: 5px; }

        /* 最終結算 Modal */
        #end-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1, 5, 10, 0.85); backdrop-filter: blur(10px);
            display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 500;
        }
        .end-title { font-size: 48px; color: #fff; margin-bottom: 10px; text-shadow: 0 0 30px rgba(100,220,255,0.8); }
        .end-score { font-size: 80px; font-weight: bold; color: #64dcff; margin-bottom: 30px; text-shadow: 0 0 40px rgba(100,220,255,1); }
    </style>
</head>
<body>

    <div id="challenge-ui">
        <button id="mode-toggle" class="action-btn" onclick="toggleMode()">開啟 12 方位定點挑戰</button>
        <div id="round-display" class="round-panel">回合: 1 / 5</div>
        <div id="score-display" class="score-panel">總積分: 0</div>
        <div id="feedback-controls" class="challenge-actions" style="display:none">
            <button class="action-btn" onclick="replayCurrent()">重播此題聲音</button>
            <button class="action-btn" onclick="nextRound()" id="next-btn">下一題</button>
        </div>
    </div>

    <div id="center-hint">請閉上眼聆聽...</div>

    <div id="controls-container">
        <!-- 半徑控制 (沙盒模式專用) -->
        <div class="control-group" id="radius-controls">
            <button class="ctrl-btn" onclick="setRadius(0.5)">0.5m</button>
            <button class="ctrl-btn active" onclick="setRadius(1.0)">1.0m</button>
            <button class="ctrl-btn" onclick="setRadius(2.0)">2.0m</button>
            <button class="ctrl-btn" onclick="setRadius(3.0)">3.0m</button>
        </div>
        <!-- 場景控制 -->
        <div class="control-group" id="scene-controls">
            <button class="ctrl-btn active" onclick="setScene('bathroom')">清澈水域</button>
            <button class="ctrl-btn" onclick="setScene('station')">深海大教堂</button>
            <button class="ctrl-btn" onclick="setScene('cave')">幽暗海洞</button>
            <button class="ctrl-btn" onclick="setScene('forest')">水下森林</button>
        </div>
    </div>

    <div id="end-modal">
        <div class="end-title">挑戰完成</div>
        <div class="end-score" id="final-score-text">100</div>
        <button class="action-btn" style="font-size: 18px; padding: 15px 40px;" onclick="toggleMode()">結束並返回沙盒</button>
    </div>

    <canvas id="appCanvas"></canvas>

    <script>
        /**
         * 聽能定向訓練系統 - 12 方位定點挑戰版
         * 核心機制：
         * 1. 12 個定點方位陣列，支援 Hover 呼吸光澤效果。
         * 2. 0.5m ~ 3m 多段距離空間渲染。
         * 3. 專業 5 回合挑戰制，具備角度誤差計分系統與語音提示對齊。
         */
        const canvas = document.getElementById('appCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, dpr, centerX, centerY;
        let listenerPlaneY, uiScale, iconSize;
        let displayRadiusX, displayRadiusY;

        let audioCtx;
        let convolver, masterDry, masterWet, masterCompressor;
        
        // 系統狀態
        let currentScene = 'bathroom';
        let currentRadius = 1.0;
        let isChallengeMode = false;
        let challengeState = 'idle'; // idle, listening, guessing, feedback
        let currentRound = 1;
        let totalScore = 0;
        const MAX_ROUNDS = 5;

        // 題目與解答
        let targetAngleIndex = 0;
        let targetDistance = 1.0;
        let targetType = null;
        let targetScene = null;
        let guessIndex = -1;

        const SCENE_KEYS = ['bathroom', 'station', 'cave', 'forest'];
        const DISTANCES = [0.5, 1.0, 2.0, 3.0];
        const SCENE_CONFIG = {
            bathroom: { main: '#00ccff', bg: '#021020', gridAlpha: 0.05, flow: 1.0, length: 0.5, decay: 12.0, lp: 12000, dry: 0.7, wet: 0.5 },
            station: { main: '#ffaa44', bg: '#150a02', gridAlpha: 0.08, flow: 0.35, length: 5.5, decay: 1.2, lp: 6000, dry: 0.5, wet: 0.7 },
            cave: { main: '#bb66ff', bg: '#0a0215', gridAlpha: 0.04, flow: 0.2, length: 3.5, decay: 2.5, lp: 800, dry: 0.4, wet: 0.8 },
            forest: { main: '#44ffaa', bg: '#02150a', gridAlpha: 0.06, flow: 0.65, length: 2.2, decay: 4.0, lp: 3000, dry: 0.8, wet: 0.3 }
        };

        const WAVE_TYPES = {
            SINE: { id: 'sine', color: '100, 220, 255' },
            TRIANGLE: { id: 'triangle', color: '255, 204, 170' },
            NOISE: { id: 'noise', color: '160, 255, 170' },
            BOATMAN: { id: 'boatman', color: '255, 85, 68' }
        };

        // 12 方位節點
        const ANGLES_DEG = [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330];
        let clockNodes = [];
        let hoveredNodeIndex = -1;
        let activeSoundType = WAVE_TYPES.SINE; // 預設選擇的音色
        let paletteIcons = [];
        
        let noiseBuffer = null;
        let audioPlayer = null; // 單一播放器實例

        // --- 音訊引擎初始化 ---
        async function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterCompressor = audioCtx.createDynamicsCompressor();
                masterCompressor.threshold.setTargetAtTime(-24, audioCtx.currentTime, 0.1);
                masterCompressor.connect(audioCtx.destination);
                
                convolver = audioCtx.createConvolver();
                masterDry = audioCtx.createGain(); masterWet = audioCtx.createGain();
                masterDry.connect(masterCompressor); convolver.connect(masterWet); masterWet.connect(masterCompressor);
                
                const bufferSize = audioCtx.sampleRate * 2; 
                noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
                applySceneAudio(currentScene);
            }
            if (audioCtx.state === 'suspended') await audioCtx.resume();
        }

        function applySceneAudio(scene) {
            if (!audioCtx) return;
            const cfg = SCENE_CONFIG[scene];
            const sampleRate = audioCtx.sampleRate;
            const frameCount = Math.floor(sampleRate * cfg.length);
            const buffer = audioCtx.createBuffer(2, frameCount, sampleRate);
            const filterAlpha = Math.min(1.0, (2 * Math.PI * cfg.lp) / sampleRate);
            for (let ch = 0; ch < 2; ch++) {
                const data = buffer.getChannelData(ch);
                let lastVal = 0;
                for (let i = 0; i < frameCount; i++) {
                    let t = i / sampleRate;
                    lastVal += filterAlpha * ((Math.random() * 2 - 1) - lastVal);
                    data[i] = lastVal * Math.exp(-cfg.decay * t) * 0.45;
                }
            }
            convolver.buffer = buffer;
            const now = audioCtx.currentTime;
            masterDry.gain.setTargetAtTime(cfg.dry, now, 0.15);
            masterWet.gain.setTargetAtTime(cfg.wet, now, 0.15);
            
            // 更新按鈕視覺
            document.querySelectorAll('#scene-controls .ctrl-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.includes(getSceneName(scene))) btn.classList.add('active');
            });
        }
        
        function getSceneName(key) {
            if(key==='bathroom') return '清澈'; if(key==='station') return '大教堂';
            if(key==='cave') return '海洞'; return '森林';
        }

        window.setScene = (scene) => { initAudio(); currentScene = scene; applySceneAudio(scene); };
        window.setRadius = (r) => {
            currentRadius = r;
            document.querySelectorAll('#radius-controls .ctrl-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.includes(r.toString())) btn.classList.add('active');
            });
        };

        // --- 核心播放器 (靜態 12 方位版) ---
        class DirectionalPlayer {
            constructor() {
                this.source = null; this.modulator = null; this.lfo = null;
                this.gain = null; this.panner = null; this.airFilter = null; this.pinnaFilter = null;
                this.stopTimeout = null;
            }
            
            play(typeConfig, angleDeg, distance, duration = 2.5) {
                if (!audioCtx) return;
                this.stop(); // 停止上一個聲音
                const now = audioCtx.currentTime;
                
                this.gain = audioCtx.createGain(); 
                this.panner = audioCtx.createPanner();
                this.airFilter = audioCtx.createBiquadFilter(); this.airFilter.type = 'lowpass';
                this.pinnaFilter = audioCtx.createBiquadFilter(); this.pinnaFilter.type = 'highshelf';
                
                this.panner.panningModel = (typeConfig.id === 'sine') ? 'equalpower' : 'HRTF';
                this.panner.distanceModel = 'inverse'; 
                this.panner.refDistance = 1.0; 
                this.panner.rolloffFactor = 1.8;   
                
                // 計算 Web Audio 空間座標 (0度正前方, 90度右方)
                const rad = angleDeg * Math.PI / 180;
                // Web Audio 座標系: X右, Y上, Z前(負值)
                const posX = Math.sin(rad) * distance * 2.5; 
                const posZ = -Math.cos(rad) * distance * 2.5;
                
                this.panner.positionX.value = posX;
                this.panner.positionZ.value = posZ;
                
                // 空氣吸收與耳廓濾波
                const zAbs = Math.abs(posZ/5);
                this.airFilter.frequency.value = Math.max(400, 20000 - (distance * 3500));
                this.pinnaFilter.gain.value = posZ < 0 ? 3.5 : -9.0; // 後方衰減

                // 音量動態包絡 (Burst envelope)
                this.gain.gain.setValueAtTime(0.0001, now);
                let targetVol = 0.5;
                if (typeConfig.id === 'sine' || typeConfig.id === 'triangle') targetVol = 0.6;
                
                this.gain.gain.linearRampToValueAtTime(targetVol, now + 0.1);
                this.gain.gain.setValueAtTime(targetVol, now + duration - 0.4);
                this.gain.gain.linearRampToValueAtTime(0.0001, now + duration);

                if (typeConfig.id === 'sine' || typeConfig.id === 'triangle') {
                    this.source = audioCtx.createOscillator(); this.modulator = audioCtx.createOscillator(); this.modGain = audioCtx.createGain();
                    this.source.type = typeConfig.id; this.modulator.type = 'sine'; 
                    this.modulator.connect(this.modGain); this.modGain.connect(this.source.frequency);
                    this.source.connect(this.pinnaFilter); 
                    
                    // 根據方位決定 FM 參數
                    const modFreq = 0.5 + Math.abs(posX) * 10;
                    this.modulator.frequency.value = modFreq;
                    this.modGain.gain.value = Math.max(0, (1 - distance/4) * (typeConfig.id === 'sine' ? 120 : 250));
                    this.source.frequency.value = 180 + Math.max(0, 1 - (distance/3)) * 300;
                    this.modulator.start(now);
                } else if (typeConfig.id === 'noise') {
                    this.source = audioCtx.createBufferSource(); this.source.buffer = noiseBuffer; this.source.loop = true;
                    this.filter = audioCtx.createBiquadFilter(); this.filter.type = 'bandpass'; 
                    this.filter.Q.value = Math.max(1.5, 25 - (distance * 6));
                    this.filter.frequency.value = 4200 - (distance * 600);
                    this.source.connect(this.filter); this.filter.connect(this.pinnaFilter);
                } else if (typeConfig.id === 'boatman') {
                    this.source = audioCtx.createOscillator(); this.source.type = 'sawtooth'; this.source.frequency.value = 3800;
                    this.lfo = audioCtx.createOscillator(); this.lfo.type = 'square'; this.lfo.frequency.value = 15;
                    this.lfoGain = audioCtx.createGain(); this.lfoGain.gain.value = 0.5;
                    const offset = audioCtx.createConstantSource(); offset.offset.value = 0.5; offset.start();
                    this.lfo.connect(this.lfoGain); offset.connect(this.lfoGain.gain);
                    this.pulseGain = audioCtx.createGain(); this.source.connect(this.pulseGain); this.lfoGain.connect(this.pulseGain.gain); this.pulseGain.connect(this.pinnaFilter);
                    this.lfo.start(now);
                }
                
                this.pinnaFilter.connect(this.airFilter); this.airFilter.connect(this.panner); 
                this.panner.connect(this.gain); this.gain.connect(masterDry); this.gain.connect(convolver);
                
                this.source.start(now);
                this.source.stop(now + duration);
                if (this.modulator) this.modulator.stop(now + duration);
                if (this.lfo) this.lfo.stop(now + duration);
                
                this.stopTimeout = setTimeout(() => { this.stop(); }, duration * 1000 + 100);
            }
            
            stop() {
                if (this.stopTimeout) clearTimeout(this.stopTimeout);
                if (this.gain) { this.gain.gain.cancelScheduledValues(audioCtx.currentTime); this.gain.gain.value = 0; }
                if (this.source) { try { this.source.stop(); } catch(e){} this.source.disconnect(); this.source = null; }
                if (this.modulator) { try { this.modulator.stop(); } catch(e){} this.modulator.disconnect(); this.modulator = null; }
                if (this.lfo) { try { this.lfo.stop(); } catch(e){} this.lfo.disconnect(); this.lfo = null; }
                this.gain = null;
            }
        }

        // --- 挑戰流程邏輯 ---
        window.toggleMode = async () => {
            await initAudio();
            if (audioPlayer) audioPlayer.stop();
            isChallengeMode = !isChallengeMode;
            
            const btn = document.getElementById('mode-toggle');
            const scoreDisplay = document.getElementById('score-display');
            const roundDisplay = document.getElementById('round-display');
            const fbUI = document.getElementById('feedback-controls');
            const hint = document.getElementById('center-hint');
            const radiusControls = document.getElementById('radius-controls');
            const endModal = document.getElementById('end-modal');
            
            fbUI.style.display = "none";
            endModal.style.display = "none";
            hoveredNodeIndex = -1;

            if (isChallengeMode) {
                btn.innerText = "退出挑戰模式";
                scoreDisplay.style.display = "block";
                roundDisplay.style.display = "block";
                radiusControls.style.display = "none"; // 挑戰模式隱藏手動半徑
                
                totalScore = 0; currentRound = 1;
                scoreDisplay.innerText = `總積分: 0`;
                roundDisplay.innerText = `回合: 1 / 5`;
                
                challengeState = 'preparing';
                hint.innerHTML = "準備好了嗎？<br><span style='font-size:16px; color:#fff'>點擊畫面任何地方開始測驗</span>";
                hint.style.opacity = 1;
            } else {
                btn.innerText = "開啟 12 方位定點挑戰";
                scoreDisplay.style.display = "none";
                roundDisplay.style.display = "none";
                radiusControls.style.display = "flex";
                hint.style.opacity = 0;
                challengeState = 'idle';
            }
        };

        window.nextRound = () => {
            if (currentRound >= MAX_ROUNDS) {
                // 結算
                challengeState = 'finished';
                document.getElementById('feedback-controls').style.display = "none";
                document.getElementById('center-hint').style.opacity = 0;
                const endModal = document.getElementById('end-modal');
                document.getElementById('final-score-text').innerText = totalScore;
                endModal.style.display = "flex";
                return;
            }
            
            currentRound++;
            document.getElementById('round-display').innerText = `回合: ${currentRound} / 5`;
            challengeState = 'preparing';
            document.getElementById('feedback-controls').style.display = "none";
            const hint = document.getElementById('center-hint');
            hint.innerHTML = "準備下一題...<br><span style='font-size:16px; color:#fff'>點擊畫面開始</span>";
            hint.style.opacity = 1;
            guessIndex = -1;
        };

        function startChallengePlay() {
            challengeState = 'listening';
            document.getElementById('feedback-controls').style.display = "none";
            guessIndex = -1;
            
            const hint = document.getElementById('center-hint');
            hint.innerHTML = "請閉上眼，專注聆聽...";
            hint.style.opacity = 1;
            
            // 隨機生成題目
            targetAngleIndex = Math.floor(Math.random() * 12);
            targetDistance = DISTANCES[Math.floor(Math.random() * DISTANCES.length)];
            const rTypeIdx = Math.floor(Math.random() * 4);
            targetType = Object.values(WAVE_TYPES)[rTypeIdx];
            targetScene = SCENE_KEYS[Math.floor(Math.random() * SCENE_KEYS.length)];
            
            // 套用隨機聲場
            setScene(targetScene);
            
            // 播放聲音 (2.5秒)
            if (!audioPlayer) audioPlayer = new DirectionalPlayer();
            audioPlayer.play(targetType, ANGLES_DEG[targetAngleIndex], targetDistance, 2.5);
            
            // 2.5秒後進入猜測模式
            setTimeout(() => {
                if (challengeState !== 'listening') return; // 可能中途退出了
                challengeState = 'guessing';
                hint.innerHTML = "聲音來自哪個方位？<br><span style='font-size:16px; color:#fff'>請點擊對應的圖示</span>";
            }, 2600);
        }

        window.replayCurrent = () => {
            if (challengeState !== 'feedback') return;
            if (!audioPlayer) audioPlayer = new DirectionalPlayer();
            audioPlayer.play(targetType, ANGLES_DEG[targetAngleIndex], targetDistance, 2.0);
        };

        function submitGuess(index) {
            if (challengeState !== 'guessing') return;
            guessIndex = index;
            challengeState = 'feedback';
            
            // 計算角度誤差
            let diffIdx = Math.abs(guessIndex - targetAngleIndex);
            if (diffIdx > 6) diffIdx = 12 - diffIdx; // 最遠差 6 格 (180度)
            
            let roundScore = 0;
            let feedbackText = "";
            let color = "#fff";
            
            if (diffIdx === 0) { roundScore = 20; feedbackText = "太棒了！完全正確！"; color = "#44ffaa"; }
            else if (diffIdx === 1) { roundScore = 15; feedbackText = "非常接近！只有一格的偏差"; color = "#10dcff"; }
            else if (diffIdx === 2) { roundScore = 10; feedbackText = "方向大致正確，再精確一點"; color = "#ffaa44"; }
            else if (diffIdx === 3) { roundScore = 5; feedbackText = "稍微偏離了，注意前後差異"; color = "#ff7744"; }
            else { roundScore = 0; feedbackText = "哎呀，完全相反囉！仔細聽聽看"; color = "#ff4444"; }
            
            totalScore += roundScore;
            document.getElementById('score-display').innerText = `總積分: ${totalScore}`;
            
            const hint = document.getElementById('center-hint');
            hint.innerHTML = `<div class="feedback-score" style="color:${color}">+${roundScore} 分</div>${feedbackText}`;
            
            document.getElementById('feedback-controls').style.display = "flex";
            const nextBtn = document.getElementById('next-btn');
            nextBtn.innerText = (currentRound >= MAX_ROUNDS) ? "查看總結算" : "下一題";
        }


        // --- 視覺渲染 ---
        function initLayout() {
            dpr = window.devicePixelRatio || 1; 
            width = window.innerWidth; height = window.innerHeight;
            canvas.width = width * dpr; canvas.height = height * dpr; 
            canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
            ctx.scale(dpr, dpr); 
            centerX = width / 2; listenerPlaneY = height * 0.52; centerY = listenerPlaneY;
            
            uiScale = Math.min(1.0, width / 1000) + 0.3; 
            iconSize = Math.max(18, Math.min(30, width * 0.06));
            
            // 12 方位座標計算
            displayRadiusX = Math.min(width * 0.38, height * 0.35);
            displayRadiusY = displayRadiusX * 0.75; // 橢圓透視
            
            clockNodes = [];
            for(let i=0; i<12; i++) {
                const angleDeg = ANGLES_DEG[i];
                const rad = angleDeg * Math.PI / 180;
                const nx = centerX + Math.sin(rad) * displayRadiusX;
                const ny = centerY - Math.cos(rad) * displayRadiusY; // 0度在正上方(視覺前方)
                clockNodes.push({ x: nx, y: ny, angle: angleDeg });
            }

            const paletteX = width - iconSize * 1.8;
            paletteIcons = [
                { typeConfig: WAVE_TYPES.SINE, x: paletteX, y: height * 0.20 },
                { typeConfig: WAVE_TYPES.TRIANGLE, x: paletteX, y: height * 0.35 },
                { typeConfig: WAVE_TYPES.NOISE, x: paletteX, y: height * 0.50 },
                { typeConfig: WAVE_TYPES.BOATMAN, x: paletteX, y: height * 0.65 }
            ];
        }

        function drawBackground() {
            const cfg = SCENE_CONFIG[currentScene];
            const t = Date.now() * 0.001 * cfg.flow;
            const bgGrad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, height * 1.1);
            bgGrad.addColorStop(0, cfg.bg); bgGrad.addColorStop(1, '#000000');
            ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, width, height);
            
            // 繪製雷達網格
            ctx.lineWidth = 1; ctx.strokeStyle = cfg.main + '22';
            for (let i = 0; i < 12; i++) {
                const rad = ANGLES_DEG[i] * Math.PI / 180;
                ctx.beginPath(); ctx.moveTo(centerX, centerY); 
                ctx.lineTo(centerX + Math.sin(rad) * width, centerY - Math.cos(rad) * height); 
                ctx.stroke();
            }
            for (let r = 1; r < 5; r++) {
                ctx.beginPath(); 
                ctx.ellipse(centerX, centerY, (displayRadiusX/3)*r, (displayRadiusY/3)*r, 0, 0, Math.PI * 2); 
                ctx.stroke();
            }
            
            // 聽者頭部中心
            ctx.save(); ctx.shadowBlur = 20; ctx.shadowColor = cfg.main + '55'; 
            ctx.fillStyle = cfg.main + '33'; ctx.strokeStyle = cfg.main + 'aa';
            ctx.beginPath(); ctx.ellipse(centerX, centerY + 5, 24, 10, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(centerX, centerY - 8, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); 
            ctx.restore();
        }

        function drawGeometry(ctx, type, x, y, baseSize, rgbStr, alpha = 1.0, pulse = 0, extraScale = 1.0) {
            let currentSize = baseSize * extraScale; 
            if (type === 'sine' || type === 'triangle') currentSize *= 1.25; 
            
            ctx.save(); ctx.translate(x, y); 
            const glowSize = currentSize * 3;
            const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, glowSize);
            glow.addColorStop(0, `rgba(${rgbStr}, ${alpha * 0.5})`); glow.addColorStop(1, 'transparent');
            ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, 0, glowSize, 0, Math.PI * 2); ctx.fill();
            
            ctx.fillStyle = `rgba(${rgbStr}, ${alpha})`; ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.9})`; ctx.lineWidth = 2.0;
            if (type === 'sine') {
                const r = Math.max(0.1, currentSize * 0.65 + Math.sin(pulse * 2.0) * 3);
                ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.rotate(pulse * 0.5); ctx.beginPath(); ctx.arc(currentSize * 0.4, 0, Math.max(0.1, currentSize * 0.35), 0, Math.PI * 2); ctx.stroke();
            } else if (type === 'triangle') {
                ctx.save(); ctx.rotate(pulse * 0.5); const s1 = currentSize * 1.2;
                ctx.beginPath(); ctx.moveTo(0, -s1); ctx.lineTo(s1, s1 * 0.8); ctx.lineTo(-s1, s1 * 0.8); ctx.closePath(); ctx.stroke(); ctx.restore();
                ctx.save(); ctx.rotate(-pulse * 0.4); const s2 = s1 * 0.6;
                ctx.beginPath(); ctx.moveTo(0, s2); ctx.lineTo(s2, -s2 * 0.8); ctx.lineTo(-s2, -s2 * 0.8); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
            } else if (type === 'noise') {
                ctx.beginPath(); for (let i = 0; i < 12; i++) {
                    let r = currentSize * (0.8 + Math.random() * 0.3);
                    let a = (i / 12) * Math.PI * 2; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                } ctx.closePath(); ctx.fill(); ctx.stroke();
            } else if (type === 'boatman') {
                ctx.rotate(pulse * 0.4); const s = currentSize * 0.9;
                ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s * 0.6, 0); ctx.lineTo(0, s); ctx.lineTo(-s * 0.6, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(s * 0.4, -s * 0.3); ctx.lineTo(s * 1.2, -s * 0.8); ctx.moveTo(-s * 0.4, -s * 0.3); ctx.lineTo(-s * 1.2, -s * 0.8); ctx.stroke();
            }
            ctx.restore();
        }

        function animate() {
            drawBackground();
            const now = Date.now();
            const pulse = now * 0.002;
            
            // 繪製調色盤 (僅沙盒模式且閒置時可用，挑戰模式也可見但不互動物件)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.01)'; ctx.fillRect(width - iconSize * 2.5, 0, iconSize * 2.5, height);
            paletteIcons.forEach(p => {
                const isActive = (!isChallengeMode && p.typeConfig.id === activeSoundType.id);
                const a = isActive ? 1.0 : 0.4;
                const scale = isActive ? 1.2 : 1.0;
                drawGeometry(ctx, p.typeConfig.id, p.x, p.y, iconSize, p.typeConfig.color, a, pulse, scale);
                if (isActive) {
                    ctx.strokeStyle = `rgba(${p.typeConfig.color}, 0.8)`; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.arc(p.x, p.y, iconSize * 2, 0, Math.PI*2); ctx.stroke();
                }
            });

            // 繪製 12 個節點
            const renderType = isChallengeMode ? targetType : activeSoundType;
            if (renderType) {
                for (let i = 0; i < 12; i++) {
                    const node = clockNodes[i];
                    let alpha = 0.2; // 預設暗態
                    let scale = 0.8;
                    
                    if (isChallengeMode) {
                        if (challengeState === 'listening') {
                            alpha = 0.1; // 聆聽時全滅
                        } else if (challengeState === 'guessing') {
                            alpha = 0.3;
                            if (hoveredNodeIndex === i) {
                                alpha = 0.8; 
                                scale = 1.1 + 0.15 * Math.sin(now / 150); // 呼吸縮放
                            }
                        } else if (challengeState === 'feedback' || challengeState === 'replaying') {
                            if (i === targetAngleIndex) {
                                alpha = 1.0; scale = 1.3; // 正確答案高亮
                                // 畫連線
                                ctx.beginPath(); 
                                const beamGrad = ctx.createLinearGradient(centerX, centerY, node.x, node.y);
                                beamGrad.addColorStop(0, 'rgba(100, 220, 255, 0.1)'); beamGrad.addColorStop(1, `rgba(${renderType.color}, 0.8)`);
                                ctx.strokeStyle = beamGrad; ctx.lineWidth = 3; ctx.moveTo(centerX, centerY); ctx.lineTo(node.x, node.y); ctx.stroke();
                            } else if (i === guessIndex) {
                                alpha = 0.8; scale = 1.0; // 玩家猜錯的點
                                ctx.fillStyle = "#ff4444"; ctx.shadowBlur = 10; ctx.shadowColor = "#ff0000";
                                ctx.beginPath(); ctx.arc(node.x, node.y, 8, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
                            }
                        }
                    } else {
                        // 沙盒模式
                        if (hoveredNodeIndex === i) {
                            alpha = 0.8; scale = 1.1 + 0.15 * Math.sin(now / 150);
                        } else {
                            alpha = 0.4;
                        }
                    }
                    
                    drawGeometry(ctx, renderType.id, node.x, node.y, iconSize, renderType.color, alpha, pulse, scale);
                }
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('pointermove', (e) => {
            const pt = { x: e.clientX, y: e.clientY };
            hoveredNodeIndex = -1;
            // 僅在允許互動的狀態下偵測 Hover
            if ((!isChallengeMode) || (isChallengeMode && challengeState === 'guessing')) {
                for (let i = 0; i < 12; i++) {
                    const node = clockNodes[i];
                    if (Math.sqrt((pt.x-node.x)**2 + (pt.y-node.y)**2) < 40 * uiScale) {
                        hoveredNodeIndex = i; break;
                    }
                }
            }
        });

        window.addEventListener('pointerdown', async (e) => {
            if (e.target.tagName === 'BUTTON') return;
            await initAudio(); 
            const pt = { x: e.clientX, y: e.clientY };
            
            // 1. 檢查是否點擊右側調色盤 (僅沙盒模式切換音色)
            if (!isChallengeMode) {
                for (let i = 0; i < paletteIcons.length; i++) {
                    const p = paletteIcons[i];
                    if (Math.sqrt((pt.x-p.x)**2 + (pt.y-p.y)**2) < 40 * uiScale) {
                        activeSoundType = p.typeConfig; return;
                    }
                }
            }

            // 2. 挑戰模式點擊螢幕推進流程
            if (isChallengeMode) { 
                if (challengeState === 'preparing') { startChallengePlay(); return; } 
            }

            // 3. 檢查是否點擊 12 個方位節點
            let clickedNodeIndex = -1;
            for (let i = 0; i < 12; i++) {
                const node = clockNodes[i];
                if (Math.sqrt((pt.x-node.x)**2 + (pt.y-node.y)**2) < 45 * uiScale) {
                    clickedNodeIndex = i; break;
                }
            }

            if (clickedNodeIndex !== -1) {
                if (isChallengeMode && challengeState === 'guessing') {
                    submitGuess(clickedNodeIndex);
                } else if (!isChallengeMode) {
                    // 沙盒模式：點擊播放該方位聲音
                    if (!audioPlayer) audioPlayer = new DirectionalPlayer();
                    audioPlayer.play(activeSoundType, ANGLES_DEG[clickedNodeIndex], currentRadius, 2.0);
                }
            }
        });

        window.addEventListener('resize', initLayout); initLayout(); animate();
    </script>
</body>
