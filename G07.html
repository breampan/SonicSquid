<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>深海神射手 - FPS 聽能打地鼠版</title>
    <style>
        * { cursor: crosshair !important; user-select: none; -webkit-user-select: none; box-sizing: border-box; }
        
        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            overflow: hidden; background-color: #01050a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: none;
        }
        
        #appCanvas { position: absolute; top: 0; left: 0; z-index: 10; display: block; }

        #unlock-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #01050a; z-index: 100000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #64dcff; 
        }
        .pulse-circle {
            width: 80px; height: 80px; border-radius: 50%; background: rgba(100, 220, 255, 0.2);
            animation: pulse 1.5s infinite; margin-bottom: 20px; border: 2px solid #64dcff;
        }
        @keyframes pulse { 0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(100, 220, 255, 0.7); } 70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(100, 220, 255, 0); } 100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(100, 220, 255, 0); } }

        #start-menu {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: none; flex-direction: column; gap: 15px; z-index: 100;
            background: rgba(5, 15, 25, 0.95); 
            padding: 40px 60px; border-radius: 24px; border: 1px solid rgba(100,220,255,0.3);
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .menu-title { color: #fff; font-size: 36px; margin-bottom: 10px; letter-spacing: 2px; text-shadow: 0 0 20px rgba(100,220,255,0.8);}
        
        .action-btn {
            background: rgba(100, 220, 255, 0.15); border: 2px solid #64dcff;
            color: #64dcff; padding: 15px 40px; border-radius: 30px;
            font-weight: bold; font-size: 18px; letter-spacing: 2px;
            transition: all 0.2s; text-align: center; margin-top: 20px; cursor: pointer;
        }
        .action-btn:hover { filter: brightness(1.5) drop-shadow(0 0 20px #64dcff); background: rgba(100, 220, 255, 0.3); }
        .action-btn:active { transform: scale(0.95); }

        #game-ui {
            position: absolute; top: 25px; left: 30px; z-index: 100; pointer-events: none;
            display: none;
        }
        .score-board {
            color: #ffaa44; font-size: 32px; font-weight: bold; 
            text-shadow: 0 0 15px rgba(255,170,68,0.8); margin-bottom: 5px;
            letter-spacing: 2px; transition: transform 0.1s;
        }
        .combo-board { color: #44ffaa; font-size: 18px; opacity: 0.8; transition: transform 0.1s; }
        .hint-text { color: #fff; font-size: 16px; margin-top: 10px; opacity: 0.7; }
    </style>
</head>
<body>

    <div id="unlock-overlay">
        <div class="pulse-circle"></div>
        <h2 style="letter-spacing: 2px;">音訊引擎準備就緒</h2>
        <p style="opacity: 0.8;">請點擊螢幕開啟 3D 聲場</p>
    </div>

    <div id="start-menu">
        <div class="menu-title">深海神射手</div>
        <div style="color: rgba(255,255,255,0.8); font-size: 16px; margin-bottom: 10px; line-height: 1.8; text-align: left; padding: 0 20px;">
            🎮 <b>FPS 視角：</b>你在畫面正下方，前方是廣闊的 15m 聲場。<br>
            🦇 <b>盲聽索敵：</b>目標會先隱形發出 1.5 秒聲音，請聽聲辨位瞄準！<br>
            🎯 <b>限時射擊：</b>目標現身後只有短暫時間能射擊，請把握機會。<br>
            💨 <b>物理箭矢：</b>點擊左鍵射出，享受極致的都卜勒破風感。
        </div>
        <button class="action-btn" id="start-btn">開始狩獵</button>
    </div>

    <div id="game-ui">
        <div class="score-board" id="score-text">SCORE: 0</div>
        <div class="combo-board" id="combo-text">聆聽深海的聲音...</div>
        <div class="hint-text">滑鼠轉向瞄準 / 點擊左鍵射擊</div>
    </div>

    <canvas id="appCanvas"></canvas>

    <script>
        const canvas = document.getElementById('appCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height, dpr, centerX, listenerPlaneY;
        let displayRadiusX, displayRadiusY, uiScale;
        
        let audioCtx, masterCompressor, convolver, noiseBuffer;
        let isSystemUnlocked = false;
        let gameState = 'menu'; 
        
        let pointerX = window.innerWidth / 2;
        let pointerY = window.innerHeight / 2;
        let bowAngle = 0; 
        let lastBowAngle = 0;
        let score = 0;

        let targetMole = null; 
        let arrows = [];
        let spawnTimer = 0;
        let recoilTime = 0; 

        const WAVE_TYPES = {
            BELL: { id: 'bell', color: '100, 220, 255', norm: 1.0 },
            ROTOR: { id: 'rotor', color: '255, 204, 170', norm: 1.2 },
            FROG: { id: 'frog', color: '255, 85, 68', norm: 1.1 },
            WIND: { id: 'wind', color: '160, 255, 170', norm: 1.5 }
        };

        // 透視幾何轉換
        function getMappedCoords(angleRad, distMeters) {
            const px = Math.sin(angleRad) * distMeters;
            const pz = -Math.cos(angleRad) * distMeters; 
            
            const zDepth = Math.abs(pz); 
            const fovScale = 400 * uiScale / (zDepth + 2.0); 
            
            const screenX = centerX + (px * fovScale);
            const screenY = listenerPlaneY - (zDepth * fovScale * 0.8);

            return {
                x: screenX,
                y: screenY,
                px: px, 
                pz: pz,
                depthScale: Math.max(0.15, 3.0 / (zDepth + 3.0)) 
            };
        }

        function safeSetPanner(panner, x, y, z) {
            if (!panner) return;
            try {
                if (panner.positionX && typeof panner.positionX.setTargetAtTime === 'function') {
                    const now = audioCtx.currentTime;
                    panner.positionX.setTargetAtTime(x, now, 0.05);
                    panner.positionY.setTargetAtTime(y, now, 0.05);
                    panner.positionZ.setTargetAtTime(z, now, 0.05);
                } else {
                    panner.setPosition(x, y, z);
                }
            } catch(e) {}
        }

        function unlockAudioAndStart() {
            if (isSystemUnlocked) return;
            isSystemUnlocked = true;
            
            document.getElementById('unlock-overlay').style.display = 'none';
            document.getElementById('start-menu').style.display = 'flex';
            
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterCompressor = audioCtx.createDynamicsCompressor();
                masterCompressor.threshold.value = -12;
                masterCompressor.ratio.value = 4;
                masterCompressor.connect(audioCtx.destination);
                
                convolver = audioCtx.createConvolver();
                convolver.connect(masterCompressor);
                
                const sampleRate = audioCtx.sampleRate;
                const frameCount = Math.floor(sampleRate * 2.5);
                const buffer = audioCtx.createBuffer(2, frameCount, sampleRate);
                for (let ch = 0; ch < 2; ch++) {
                    const data = buffer.getChannelData(ch);
                    for (let i = 0; i < frameCount; i++) {
                        data[i] = (Math.random() * 2 - 1) * Math.exp(-3.0 * (i/sampleRate)) * 0.03;
                    }
                }
                convolver.buffer = buffer;

                noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < output.length; i++) output[i] = Math.random() * 2 - 1;

            } catch (e) { console.error("Audio Init Failed", e); }
            
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        class TargetMole {
            constructor() {
                const typesArray = Object.values(WAVE_TYPES);
                this.type = typesArray[Math.floor(Math.random() * typesArray.length)];
                
                // ★ 修正 1：動態視野約束 (Frustum Culling)
                // 先決定深度 (Z軸)，確保在 3m 到 12m 之間交錯
                const zDepth = 3.0 + Math.random() * 9.0; 
                
                // 根據目前螢幕寬度與深度，反推可以容納的最大 X 物理距離
                const fovScale = 400 * uiScale / (zDepth + 2.0); 
                // 保留 80 像素的安全邊界，確保圖示不會被切掉
                const maxPx = (centerX - 80 * uiScale) / fovScale;
                
                // 隨機產生 X 座標 (絕對不會跑出螢幕外)
                const px = (Math.random() * 2 - 1) * maxPx;
                
                this.dist = Math.sqrt(px*px + zDepth*zDepth);
                this.angleRad = Math.atan2(px, zDepth); 
                
                this.updateProjection();
                
                this.pulse = 0;
                this.isDying = false;
                
                this.state = 0; 
                this.scale = 0; 
                this.revealTimer = 90; // 1.5 秒盲聽
                this.aliveTimer = 180; // 現身後存活 3 秒
                
                this.nodes = [];
                this.initAudio();
                
                document.getElementById('combo-text').innerText = "🔊 聆聽方位！(尚未現身)";
                document.getElementById('combo-text').style.color = "#ffaa44";
            }

            updateProjection() {
                const coords = getMappedCoords(this.angleRad, this.dist);
                this.x = coords.x; 
                this.y = coords.y;
                this.audioX = coords.px; 
                this.audioZ = coords.pz;
                this.depthScale = coords.depthScale;
            }

            initAudio() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                
                this.gain = audioCtx.createGain(); 
                this.gain.gain.value = 0.0001; 
                
                this.panner = audioCtx.createPanner();
                this.panner.panningModel = 'HRTF';
                this.panner.distanceModel = 'inverse'; 
                this.panner.refDistance = 1.0; 
                this.panner.rolloffFactor = 1.0; 
                safeSetPanner(this.panner, this.audioX, 0, this.audioZ);

                this.conchaBoost = audioCtx.createBiquadFilter(); this.conchaBoost.type = 'peaking'; this.conchaBoost.frequency.value = 3500; this.conchaBoost.Q.value = 1.5;
                this.headShadow = audioCtx.createBiquadFilter(); this.headShadow.type = 'lowpass';
                this.headShadow.frequency.value = Math.max(800, 20000 - (this.dist * 1200)); 

                if (this.type.id === 'bell') {
                    [440, 880, 1320].forEach((freq, i) => {
                        let osc = audioCtx.createOscillator(); let oscGain = audioCtx.createGain();
                        osc.type = 'sine'; osc.frequency.value = freq;
                        this.nodes.push({type: 'env', gain: oscGain, i: i, lastTrigger: 0});
                        osc.connect(oscGain); oscGain.connect(this.conchaBoost);
                        osc.start(now); this.nodes.push(osc);
                    });
                } else if (this.type.id === 'rotor') {
                    let osc = audioCtx.createOscillator(); osc.type = 'sawtooth'; osc.frequency.value = 80;
                    let lfo = audioCtx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 10.0; 
                    let lfoGain = audioCtx.createGain(); lfoGain.gain.value = 0.8;
                    let amNode = audioCtx.createGain(); amNode.gain.value = 0;
                    lfo.connect(lfoGain);
                    try { const off = audioCtx.createConstantSource(); off.offset.value = 0.5; off.start(now); off.connect(lfoGain.gain); this.nodes.push(off); } catch(e) {}
                    lfoGain.connect(amNode.gain); osc.connect(amNode); amNode.connect(this.conchaBoost);
                    osc.start(now); lfo.start(now); this.nodes.push(osc, lfo);
                } else if (this.type.id === 'frog') {
                    let osc = audioCtx.createOscillator(); osc.type = 'square'; osc.frequency.value = 250;
                    let filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.Q.value = 8.0; filter.frequency.value = 600;
                    let lfo = audioCtx.createOscillator(); lfo.type = 'sawtooth'; lfo.frequency.value = 3.0; 
                    let lfoGain = audioCtx.createGain(); lfoGain.gain.value = 1500;
                    lfo.connect(lfoGain); lfoGain.connect(filter.frequency); osc.connect(filter); filter.connect(this.conchaBoost);
                    osc.start(now); lfo.start(now); this.nodes.push(osc, lfo);
                } else if (this.type.id === 'wind') {
                    let src = audioCtx.createBufferSource(); src.buffer = noiseBuffer; src.loop = true;
                    let f = audioCtx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 2.0; f.frequency.value = 800;
                    src.connect(f); f.connect(this.conchaBoost);
                    src.start(now); this.nodes.push(src);
                }

                this.dryGain = audioCtx.createGain(); 
                this.wetGain = audioCtx.createGain();
                this.dryGain.gain.value = Math.max(0.1, 1.0 / (1.0 + this.dist*0.5));
                this.wetGain.gain.value = Math.min(1.0, this.dist * 0.3);

                this.conchaBoost.connect(this.headShadow); this.headShadow.connect(this.panner);
                this.panner.connect(this.gain);
                this.gain.connect(this.dryGain); this.gain.connect(this.wetGain);
                this.dryGain.connect(masterCompressor); this.wetGain.connect(convolver);
                
                this.gain.gain.setTargetAtTime(0.5 * this.type.norm, now, 0.2); 
            }

            die(hit = false) {
                if (this.isDying) return;
                this.isDying = true;
                
                if (hit && audioCtx) {
                    const hitOsc = audioCtx.createOscillator();
                    const hitGain = audioCtx.createGain();
                    hitOsc.type = 'square';
                    hitOsc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                    hitOsc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
                    hitGain.gain.setValueAtTime(0.8, audioCtx.currentTime);
                    hitGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                    hitOsc.connect(hitGain); hitGain.connect(masterCompressor);
                    hitOsc.start(); hitOsc.stop(audioCtx.currentTime + 0.25);
                } else {
                    document.getElementById('combo-text').innerText = "💨 錯失目標...";
                    document.getElementById('combo-text').style.color = "#ff4444";
                }

                if (this.gain && audioCtx) {
                    try {
                        const now = audioCtx.currentTime;
                        this.gain.gain.cancelScheduledValues(now);
                        this.gain.gain.setTargetAtTime(0.0001, now, 0.1);
                    } catch(e) {}
                }
                
                setTimeout(() => { 
                    this.cleanup(); 
                    targetMole = null; 
                }, 500);
            }

            cleanup() {
                this.nodes.forEach(n => { try { if(n.stop) n.stop(); } catch(e){} });
                if (this.gain) { try{this.gain.disconnect();}catch(e){} this.gain = null; }
            }

            update() {
                this.pulse += 0.08;
                
                if (this.isDying) {
                    this.scale -= 0.15; 
                    return; 
                }

                if (this.state === 0) {
                    this.revealTimer--;
                    if (this.revealTimer <= 0) {
                        this.state = 1; // 現身
                        document.getElementById('combo-text').innerText = "👀 目標出現！快射擊！";
                        document.getElementById('combo-text').style.color = "#64dcff";
                    }
                } else if (this.state === 1) {
                    if (this.scale < 1.0) this.scale += 0.1; 
                    
                    this.aliveTimer--;
                    if (this.aliveTimer <= 0) {
                        this.die(false); // 時間到，逃跑
                    }
                }

                if (audioCtx && this.gain && this.type.id === 'bell') {
                    const now = audioCtx.currentTime;
                    this.nodes.forEach(n => {
                        if (n.type === 'env' && now - n.lastTrigger > 1.0 + n.i*0.2) {
                            try {
                                n.gain.gain.cancelScheduledValues(now);
                                n.gain.gain.setValueAtTime(0, now);
                                n.gain.gain.setTargetAtTime(1.0 / (n.i+1), now, 0.01);
                                n.gain.gain.setTargetAtTime(0.0001, now + 0.1, 0.3);
                                n.lastTrigger = now;
                            } catch(e){}
                        }
                    });
                }
            }

            draw(ctx) {
                if (this.state === 0 || this.scale <= 0) return; 
                if(isNaN(this.x) || isNaN(this.y)) return;
                
                // ★ 修正 2：大幅放大 Icon，基礎 Size 從 20 提升到 38
                let currentSize = Math.max(2, 38 * uiScale * this.depthScale * this.scale); 
                if (this.type.id === 'bell' || this.type.id === 'rotor') currentSize *= 1.15; 
                
                let alpha = this.scale;
                if (this.aliveTimer < 60 && !this.isDying) alpha = Math.abs(Math.sin(this.pulse * 2.0)); 

                ctx.save(); ctx.translate(this.x, this.y); 
                
                const glowSize = Math.max(1, currentSize * 4.5);
                const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, glowSize);
                glow.addColorStop(0, `rgba(${this.type.color}, ${alpha * 0.6})`); glow.addColorStop(1, 'transparent');
                ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, 0, glowSize, 0, Math.PI * 2); ctx.fill();
                
                ctx.fillStyle = `rgba(${this.type.color}, ${alpha})`; 
                ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.9})`; 
                ctx.lineWidth = 2.0; ctx.lineJoin = 'round'; ctx.lineCap = 'round';

                if (this.type.id === 'bell') { 
                    ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, currentSize*0.6), Math.PI, 0); 
                    ctx.lineTo(currentSize*0.8, currentSize*0.5); ctx.lineTo(-currentSize*0.8, currentSize*0.5); 
                    ctx.closePath(); ctx.fill(); ctx.stroke();
                    ctx.beginPath(); ctx.arc(0, currentSize*0.7, Math.max(0.1, currentSize*0.2), 0, Math.PI*2); ctx.stroke();
                } else if (this.type.id === 'rotor') { 
                    ctx.rotate(this.pulse * 2.0); 
                    for(let i=0; i<4; i++) {
                        ctx.rotate(Math.PI/2); ctx.beginPath();
                        ctx.ellipse(0, -currentSize*0.6, Math.max(0.1, currentSize*0.2), Math.max(0.1, currentSize*0.6), 0, 0, Math.PI*2); ctx.stroke();
                    }
                    ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, currentSize*0.3), 0, Math.PI*2); ctx.fill(); ctx.stroke();
                } else if (this.type.id === 'frog') { 
                    const pulseEye = Math.abs(Math.sin(this.pulse * 6)); 
                    ctx.beginPath();
                    ctx.ellipse(-currentSize*0.4, 0, Math.max(0.1, currentSize*0.4), Math.max(0.1, currentSize*0.3 * (1-pulseEye*0.5)), 0, 0, Math.PI*2);
                    ctx.ellipse(currentSize*0.4, 0, Math.max(0.1, currentSize*0.4), Math.max(0.1, currentSize*0.3 * (1-pulseEye*0.5)), 0, 0, Math.PI*2);
                    ctx.fill(); ctx.stroke();
                    ctx.fillStyle = '#000'; ctx.beginPath();
                    ctx.arc(-currentSize*0.4, 0, Math.max(0.1, currentSize*0.1), 0, Math.PI*2);
                    ctx.arc(currentSize*0.4, 0, Math.max(0.1, currentSize*0.1), 0, Math.PI*2); ctx.fill();
                } else if (this.type.id === 'wind') {
                    ctx.translate(-currentSize*0.6, 0);
                    for(let i=0; i<3; i++) {
                        let yOff = (i-1) * currentSize*0.4; ctx.beginPath(); ctx.moveTo(0, yOff);
                        ctx.bezierCurveTo(currentSize*0.6, yOff-currentSize*0.5, currentSize*0.6, yOff+currentSize*0.5, currentSize*1.2, yOff); ctx.stroke();
                    }
                }
                ctx.restore();
            }
        }

        class Arrow {
            constructor(angleRad) {
                this.angleRad = angleRad;
                this.dist = 0.5; 
                
                const coords = getMappedCoords(this.angleRad, this.dist);
                this.x = coords.x;
                this.y = coords.y;
                this.audioX = coords.px;
                this.audioZ = coords.pz;
                this.depthScale = coords.depthScale;
                
                this.distSpeed = 15.0 / 90.0; 
                this.isDead = false;
                this.initAudio();
            }

            initAudio() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                this.gain = audioCtx.createGain(); 
                this.panner = audioCtx.createPanner();
                
                this.panner.panningModel = 'HRTF';
                this.panner.distanceModel = 'inverse'; 
                this.panner.refDistance = 0.5; 
                this.panner.rolloffFactor = 2.0; 
                
                this.src = audioCtx.createOscillator();
                this.src.type = 'sawtooth';
                this.src.frequency.setValueAtTime(1200, now);
                this.src.frequency.exponentialRampToValueAtTime(100, now + 0.8); 
                
                this.filter = audioCtx.createBiquadFilter();
                this.filter.type = 'lowpass';
                this.filter.frequency.value = 15000;
                
                this.src.connect(this.filter); this.filter.connect(this.panner);
                this.panner.connect(this.gain); this.gain.connect(masterCompressor); 
                
                this.gain.gain.setValueAtTime(0.8, now);
                this.gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2); 
                
                this.src.start(now);
                this.src.stop(now + 1.3);
            }

            update() {
                this.dist += this.distSpeed; 
                
                const coords = getMappedCoords(this.angleRad, this.dist);
                this.x = coords.x;
                this.y = coords.y;
                this.audioX = coords.px;
                this.audioZ = coords.pz;
                this.depthScale = coords.depthScale;

                if (this.panner && audioCtx) {
                    const now = audioCtx.currentTime;
                    safeSetPanner(this.panner, this.audioX, 0, this.audioZ);
                    try { this.filter.frequency.setTargetAtTime(Math.max(400, 15000 - this.dist * 1200), now, 0.05); } catch(e){}
                }

                if (targetMole && targetMole.state === 1 && !targetMole.isDying) {
                    const dx3d = this.audioX - targetMole.audioX;
                    const dz3d = this.audioZ - targetMole.audioZ;
                    const physicalDist = Math.sqrt(dx3d*dx3d + dz3d*dz3d);
                    
                    // ★ 修正 3：增加碰撞容錯率 (1.2m -> 2.0m)
                    if (physicalDist < 2.0) {
                        targetMole.die(true);
                        this.die();
                        score += 100;
                        const sb = document.getElementById('score-text');
                        sb.innerText = `SCORE: ${score}`;
                        sb.style.transform = "scale(1.2)";
                        
                        const cb = document.getElementById('combo-text');
                        cb.innerText = "🎯 精準命中！";
                        cb.style.color = "#44ffaa";
                        cb.style.transform = "scale(1.2)";
                        
                        setTimeout(() => { 
                            sb.style.transform = "scale(1)"; 
                            cb.style.transform = "scale(1)"; 
                        }, 150);
                    }
                }

                if (this.dist > 15.0) this.die();
            }

            die() {
                this.isDead = true;
                if (this.gain && audioCtx) {
                    try {
                        const now = audioCtx.currentTime;
                        this.gain.gain.cancelScheduledValues(now);
                        this.gain.gain.setTargetAtTime(0.0001, now, 0.05);
                        setTimeout(() => { try{this.src.stop();}catch(e){} this.gain.disconnect(); }, 200);
                    } catch(e){}
                }
            }

            draw(ctx) {
                if(isNaN(this.x) || isNaN(this.y)) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angleRad);
                
                ctx.scale(this.depthScale, this.depthScale);
                
                ctx.strokeStyle = '#44ffaa';
                ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(0, 15*uiScale); ctx.lineTo(0, -15*uiScale); ctx.stroke();
                
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.moveTo(0, -20*uiScale); ctx.lineTo(6*uiScale, -10*uiScale); ctx.lineTo(-6*uiScale, -10*uiScale); ctx.closePath(); ctx.fill();
                
                ctx.shadowBlur = 10; ctx.shadowColor = '#44ffaa'; ctx.strokeStyle = 'rgba(68, 255, 170, 0.3)';
                ctx.beginPath(); ctx.moveTo(0, 15*uiScale); ctx.lineTo(0, 40*uiScale); ctx.stroke();
                ctx.restore();
            }
        }

        let bowGainNode = null, bowFilter = null, bowPanner = null, bowSrc = null;
        
        function updateBowAudio() {
            if (!audioCtx || gameState !== 'playing') return;
            const now = audioCtx.currentTime;
            
            if (!bowGainNode) {
                bowGainNode = audioCtx.createGain(); bowGainNode.gain.value = 0.0001;
                bowFilter = audioCtx.createBiquadFilter(); bowFilter.type = 'bandpass'; bowFilter.frequency.value = 800; bowFilter.Q.value = 2.0;
                bowPanner = audioCtx.createPanner(); bowPanner.panningModel = 'HRTF'; bowPanner.distanceModel = 'inverse'; bowPanner.refDistance = 0.5;
                
                bowSrc = audioCtx.createBufferSource(); bowSrc.buffer = noiseBuffer; bowSrc.loop = true;
                bowSrc.connect(bowFilter); bowFilter.connect(bowGainNode); bowGainNode.connect(bowPanner); bowPanner.connect(masterCompressor); 
                bowSrc.start(now);
            }

            let dx = pointerX - centerX;
            let dy = listenerPlaneY - pointerY; 
            if (dy < 10) dy = 10; 

            let targetAngle = Math.atan2(dx, dy); 
            if(isNaN(targetAngle)) targetAngle = 0;
            
            let delta = targetAngle - bowAngle;
            while (delta > Math.PI) delta -= Math.PI * 2;
            while (delta < -Math.PI) delta += Math.PI * 2;
            
            bowAngle += delta * 0.2; 
            const angularVelocity = Math.abs(bowAngle - lastBowAngle);
            lastBowAngle = bowAngle;
            
            try {
                const px = Math.sin(bowAngle) * 0.5;
                const pz = -Math.cos(bowAngle) * 0.5;
                safeSetPanner(bowPanner, px, 0, pz);

                const targetVol = Math.min(0.8, angularVelocity * 15);
                bowGainNode.gain.setTargetAtTime(Math.max(0.0001, targetVol), now, 0.05);
                bowFilter.frequency.setTargetAtTime(400 + Math.min(1000, angularVelocity * 8000), now, 0.05);
            } catch(e){}
        }

        function shootArrow() {
            if (gameState !== 'playing' || isNaN(bowAngle)) return;
            arrows.push(new Arrow(bowAngle));
            
            if (audioCtx) {
                try {
                    const tOsc = audioCtx.createOscillator(); const tGain = audioCtx.createGain();
                    tOsc.type = 'triangle'; tOsc.frequency.setValueAtTime(200, audioCtx.currentTime); tOsc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
                    tGain.gain.setValueAtTime(1.0, audioCtx.currentTime); tGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                    tOsc.connect(tGain); tGain.connect(masterCompressor);
                    tOsc.start(); tOsc.stop(audioCtx.currentTime + 0.3);
                } catch(e){}
            }
            
            recoilTime = 10; 
        }

        function startGame() {
            if (!audioCtx) unlockAudioAndStart();
            gameState = 'playing';
            
            document.body.style.cursor = 'none'; 
            document.getElementById('start-menu').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            
            score = 0; document.getElementById('score-text').innerText = `SCORE: 0`;
            targets = []; arrows = []; spawnTimer = 0; targetMole = null;
            
            let dx = pointerX - centerX;
            let dy = listenerPlaneY - pointerY; 
            if (dy < 10) dy = 10;
            bowAngle = Math.atan2(dx, dy);
            if(isNaN(bowAngle)) bowAngle = 0;
            lastBowAngle = bowAngle;
        }

        function drawPlayer() {
            if(isNaN(centerX) || isNaN(listenerPlaneY) || isNaN(bowAngle)) return;
            ctx.save();
            ctx.translate(centerX, listenerPlaneY);
            ctx.rotate(bowAngle);
            
            if (recoilTime > 0) { ctx.translate(0, 5 * uiScale); recoilTime--; }
            
            ctx.strokeStyle = '#ffaa44'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(0, 0, 40 * uiScale, Math.PI + 0.5, 2 * Math.PI - 0.5); ctx.stroke();
            
            ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(Math.cos(Math.PI+0.5)*40*uiScale, Math.sin(Math.PI+0.5)*40*uiScale);
            ctx.lineTo(0, 10*uiScale); ctx.lineTo(Math.cos(2*Math.PI-0.5)*40*uiScale, Math.sin(2*Math.PI-0.5)*40*uiScale); ctx.stroke();
            
            ctx.strokeStyle = '#64dcff'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(0, 10*uiScale); ctx.lineTo(0, -35*uiScale); ctx.stroke();
            
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(0, -45*uiScale); ctx.lineTo(5*uiScale, -35*uiScale); ctx.lineTo(-5*uiScale, -35*uiScale); ctx.closePath(); ctx.fill();
            
            ctx.restore();
        }

        function drawSafeBackground() {
            const bgGrad = ctx.createRadialGradient(centerX, listenerPlaneY, 0, centerX, listenerPlaneY, height);
            bgGrad.addColorStop(0, '#021020'); bgGrad.addColorStop(1, '#000000');
            ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, width, height);

            ctx.globalAlpha = 1.0;
            ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(0, 204, 255, 0.15)';
            
            for (let i = -4; i <= 4; i++) {
                const a = (i * 15) * Math.PI / 180;
                ctx.beginPath(); ctx.moveTo(centerX, listenerPlaneY); 
                ctx.lineTo(centerX + Math.sin(a) * displayRadiusX * 5, listenerPlaneY - Math.cos(a) * displayRadiusY * 5); 
                ctx.stroke();
            }
            
            [2, 4, 6, 8, 10, 12, 14].forEach(d => {
                ctx.beginPath();
                for (let a = -Math.PI/2; a <= Math.PI/2; a += 0.1) {
                    const c = getMappedCoords(a, d);
                    if (a === -Math.PI/2) ctx.moveTo(c.x, c.y);
                    else ctx.lineTo(c.x, c.y);
                }
                ctx.stroke();
            });

            ctx.save(); ctx.shadowBlur = 20; ctx.shadowColor = 'rgba(0,204,255,0.3)'; ctx.fillStyle = 'rgba(0,204,255,0.1)'; ctx.strokeStyle = 'rgba(0,204,255,0.5)';
            ctx.beginPath(); ctx.ellipse(centerX, listenerPlaneY, 40*uiScale, 15*uiScale, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.restore();
        }

        function animate() {
            try {
                drawSafeBackground();
                
                if (gameState === 'playing') {
                    updateBowAudio(); drawPlayer();

                    if (!targetMole) {
                        spawnTimer++;
                        if (spawnTimer > 60) { 
                            targetMole = new TargetMole();
                            spawnTimer = 0;
                        }
                    }

                    for (let i = arrows.length - 1; i >= 0; i--) {
                        arrows[i].update(); arrows[i].draw(ctx);
                        if (arrows[i].isDead) arrows.splice(i, 1);
                    }
                    
                    if (targetMole) {
                        targetMole.update(); targetMole.draw(ctx);
                    }
                    
                    ctx.save();
                    ctx.translate(pointerX, pointerY);
                    ctx.strokeStyle = recoilTime > 0 ? '#ff4444' : 'rgba(100, 220, 255, 0.8)';
                    ctx.lineWidth = 2;
                    const r = recoilTime > 0 ? 15 * uiScale : 20 * uiScale;
                    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(-r*1.5, 0); ctx.lineTo(-r*0.5, 0);
                    ctx.moveTo(r*1.5, 0); ctx.lineTo(r*0.5, 0);
                    ctx.moveTo(0, -r*1.5); ctx.lineTo(0, -r*0.5);
                    ctx.moveTo(0, r*1.5); ctx.lineTo(0, r*0.5);
                    ctx.stroke();
                    ctx.restore();
                } 
            } catch(e) { console.error("Safe Loop Exception:", e); }
            
            requestAnimationFrame(animate);
        }

        function initLayout() {
            dpr = window.devicePixelRatio || 1;
            width = window.innerWidth; height = window.innerHeight;
            canvas.width = width * dpr; canvas.height = height * dpr;
            canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
            ctx.scale(dpr, dpr); 
            
            centerX = width / 2; 
            listenerPlaneY = height * 0.9; 
            displayRadiusX = width * 0.6; 
            displayRadiusY = height * 0.5; 
            uiScale = width / 1000 + 0.5;
        }

        document.getElementById('unlock-overlay').addEventListener('click', unlockAudioAndStart);
        document.getElementById('start-btn').addEventListener('click', startGame);
        
        window.addEventListener('pointermove', e => { 
            pointerX = e.clientX; pointerY = e.clientY; 
        });

        window.addEventListener('pointerdown', e => {
            if (gameState === 'playing') shootArrow();
        });

        window.addEventListener('resize', initLayout);
        initLayout(); animate();
    </script>
</body>
</html>
