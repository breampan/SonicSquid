<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>深海神射手 - 聽能定向終極訓練版</title>
    <style>
        * { cursor: crosshair !important; user-select: none; -webkit-user-select: none; box-sizing: border-box; }
        
        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            overflow: hidden; background-color: #01050a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: none;
        }
        
        #appCanvas { position: absolute; top: 0; left: 0; z-index: 10; display: block; }

        #unlock-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #01050a; z-index: 100000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #64dcff; 
        }
        .pulse-circle {
            width: 80px; height: 80px; border-radius: 50%; background: rgba(100, 220, 255, 0.2);
            animation: pulse 1.5s infinite; margin-bottom: 20px; border: 2px solid #64dcff;
        }
        @keyframes pulse { 0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(100, 220, 255, 0.7); } 70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(100, 220, 255, 0); } 100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(100, 220, 255, 0); } }

        .modal-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: none; flex-direction: column; gap: 15px; z-index: 200;
            background: rgba(5, 15, 25, 0.95); 
            padding: 40px 60px; border-radius: 24px; border: 1px solid rgba(100,220,255,0.3);
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            pointer-events: auto;
        }
        .menu-title { color: #fff; font-size: 36px; margin-bottom: 10px; letter-spacing: 2px; text-shadow: 0 0 20px rgba(100,220,255,0.8);}
        
        .action-btn {
            background: rgba(100, 220, 255, 0.15); border: 2px solid #64dcff;
            color: #64dcff; padding: 15px 40px; border-radius: 30px;
            font-weight: bold; font-size: 18px; letter-spacing: 2px;
            transition: all 0.2s; text-align: center; margin-top: 20px; cursor: pointer; outline: none;
        }
        .action-btn:hover { filter: brightness(1.5) drop-shadow(0 0 20px #64dcff); background: rgba(100, 220, 255, 0.3); }
        .action-btn:active { transform: scale(0.95); }

        #game-ui {
            position: absolute; top: 25px; left: 30px; z-index: 100; pointer-events: none; display: none;
        }
        .level-text { color: #fff; font-size: 18px; opacity: 0.8; letter-spacing: 1px; margin-bottom: 5px; }
        .score-board {
            color: #ffaa44; font-size: 32px; font-weight: bold; 
            text-shadow: 0 0 15px rgba(255,170,68,0.8); margin-bottom: 5px;
            letter-spacing: 2px; transition: transform 0.1s;
        }
        .combo-board { color: #44ffaa; font-size: 18px; opacity: 0.8; transition: transform 0.1s; }

        #transition-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-size: 48px; font-weight: bold; letter-spacing: 4px;
            text-shadow: 0 0 30px rgba(100, 220, 255, 0.8); z-index: 300;
            pointer-events: none; opacity: 0; transition: opacity 0.5s; text-align: center;
        }
        .transition-sub { font-size: 20px; font-weight: normal; color: #ffaa44; margin-top: 10px; letter-spacing: 2px; }

        .final-score { font-size: 64px; color: #ffaa44; font-weight: bold; margin: 10px 0; text-shadow: 0 0 20px rgba(255,170,68,0.8); }
        .final-eval { font-size: 20px; color: #44ffaa; line-height: 1.6; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="unlock-overlay">
        <div class="pulse-circle"></div>
        <h2 style="letter-spacing: 2px;">音訊引擎準備就緒</h2>
        <p style="opacity: 0.8;">請點擊螢幕開啟 3D 聲場</p>
    </div>

    <div id="start-menu" class="modal-box">
        <div class="menu-title">深海神射手</div>
        <div style="color: rgba(255,255,255,0.8); font-size: 15px; margin-bottom: 10px; line-height: 1.8; text-align: left; padding: 0 20px;">
            🎮 <b>三階挑戰：</b>共 15 題，給予充裕的時間進行聽覺空間定位。<br>
            🏹 <b>精確平移：</b>轉動滑鼠，感受左右耳最純粹的金屬棘輪聲。<br>
            🦇 <b>盲聽索敵：</b>聲音領先畫面出現，先聽方位，後看目標。<br>
            💨 <b>清脆擊破：</b>高質感水晶碎裂音效與長距離都卜勒飛箭。
        </div>
        <button class="action-btn" id="start-btn">開始狩獵</button>
    </div>

    <div id="game-over-menu" class="modal-box">
        <div class="menu-title">狩獵結束</div>
        <div class="final-score" id="final-score-text">0</div>
        <div class="final-eval" id="final-eval-text">評語</div>
        <button class="action-btn" id="restart-btn" style="border-color:#44ffaa; color:#44ffaa;">再次挑戰</button>
    </div>

    <div id="transition-overlay">
        <div id="trans-title">第一關</div>
        <div class="transition-sub" id="trans-sub">瞄準時間：10.0 秒</div>
    </div>

    <div id="game-ui">
        <div class="level-text" id="level-display">關卡 1 / 3</div>
        <div class="score-board" id="score-text">SCORE: 0</div>
        <div class="combo-board" id="combo-text">聆聽深海的聲音...</div>
    </div>

    <canvas id="appCanvas"></canvas>

    <script>
        const canvas = document.getElementById('appCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height, dpr, centerX, listenerPlaneY;
        let displayRadiusX, displayRadiusY, uiScale;
        
        let audioCtx, masterCompressor, convolver, noiseBuffer;
        let bowConvolver; 
        
        let isSystemUnlocked = false;
        let gameState = 'menu'; 
        
        let pointerX = window.innerWidth / 2;
        let pointerY = window.innerHeight / 2;
        let bowAngle = 0; 
        let lastBowAngle = 0;
        let rotationAccumulator = 0; 
        
        let score = 0;
        let currentLevel = 1;
        let targetsInLevel = 0;
        let totalHits = 0;
        const TARGETS_PER_LEVEL = 5;
        
        let targetMole = null; 
        let arrows = [];
        let particles = []; 
        let spawnTimer = 0;
        let recoilTime = 0; 

        const WAVE_TYPES = {
            BELL: { id: 'bell', color: '100, 220, 255', norm: 2.0 }, 
            ROTOR: { id: 'rotor', color: '255, 204, 170', norm: 2.2 }, 
            FROG: { id: 'frog', color: '255, 85, 68', norm: 2.1 }, 
            WIND: { id: 'wind', color: '160, 255, 170', norm: 2.5 } 
        };

        // ★ 時間調整：10s, 9s, 8s (以 60FPS 計算總幀數)
        const LEVEL_CONFIG = {
            1: { total: 600, name: '第一關：初試啼聲', sub: '盲聽 5.0s ➡️ 現身 5.0s' },
            2: { total: 540, name: '第二關：聽覺凝鍊', sub: '盲聽 4.5s ➡️ 現身 4.5s' },
            3: { total: 480, name: '第三關：盲狙大師', sub: '盲聽 4.0s ➡️ 現身 4.0s' }
        };

        function getMappedCoords(angleRad, distMeters) {
            const px = Math.sin(angleRad) * distMeters;
            const pz = -Math.cos(angleRad) * distMeters; 
            const zDepth = Math.abs(pz); 
            const fovScale = 400 * uiScale / (zDepth + 2.0); 
            const screenX = centerX + (px * fovScale);
            const screenY = listenerPlaneY - (zDepth * fovScale * 0.8);

            return {
                x: screenX, y: screenY, px: px, pz: pz,
                depthScale: Math.max(0.15, 3.0 / (zDepth + 3.0)) 
            };
        }

        function safeSetPanner(panner, x, y, z) {
            if (!panner) return;
            try {
                if (panner.positionX && typeof panner.positionX.setTargetAtTime === 'function') {
                    const now = audioCtx.currentTime;
                    panner.positionX.setTargetAtTime(x, now, 0.05);
                    panner.positionY.setTargetAtTime(y, now, 0.05);
                    panner.positionZ.setTargetAtTime(z, now, 0.05);
                } else {
                    panner.setPosition(x, y, z);
                }
            } catch(e) {}
        }

        function createExplosion(x, y, colorStr) {
            for(let i=0; i<25; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 8;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    life: 1.0, color: colorStr, size: (Math.random() * 4 + 2) * uiScale
                });
            }
        }

        function unlockAudioAndStart() {
            if (isSystemUnlocked) return;
            isSystemUnlocked = true;
            document.getElementById('unlock-overlay').style.display = 'none';
            document.getElementById('start-menu').style.display = 'flex';
            
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterCompressor = audioCtx.createDynamicsCompressor();
                masterCompressor.threshold.value = -12;
                masterCompressor.ratio.value = 4;
                masterCompressor.connect(audioCtx.destination);
                
                convolver = audioCtx.createConvolver();
                convolver.connect(masterCompressor);
                const sampleRate = audioCtx.sampleRate;
                const frameCount = Math.floor(sampleRate * 0.8);
                const buffer = audioCtx.createBuffer(2, frameCount, sampleRate);
                const filterAlpha = Math.min(1.0, (2 * Math.PI * 12000) / sampleRate);
                let rmsSum = 0;
                for (let ch = 0; ch < 2; ch++) {
                    const data = buffer.getChannelData(ch); let lastVal = 0;
                    for (let i = 0; i < frameCount; i++) {
                        lastVal += filterAlpha * ((Math.random() * 2 - 1) - lastVal); 
                        data[i] = lastVal * Math.exp(-8.0 * (i/sampleRate));
                        rmsSum += data[i] * data[i];
                    }
                }
                const normalizeFactor = 0.02 / (Math.sqrt(rmsSum / (frameCount * 2)) || 1);
                for (let ch = 0; ch < 2; ch++) {
                    const data = buffer.getChannelData(ch);
                    for (let i = 0; i < frameCount; i++) data[i] *= normalizeFactor;
                }
                convolver.buffer = buffer;

                bowConvolver = audioCtx.createConvolver();
                bowConvolver.connect(masterCompressor);
                const bowFrames = Math.floor(sampleRate * 2.0);
                const bowBuf = audioCtx.createBuffer(2, bowFrames, sampleRate);
                for (let ch = 0; ch < 2; ch++) {
                    const data = bowBuf.getChannelData(ch);
                    for (let i = 0; i < bowFrames; i++) {
                        data[i] = (Math.random() * 2 - 1) * Math.exp(-3.0 * (i/sampleRate)) * 0.03;
                    }
                }
                bowConvolver.buffer = bowBuf;

                noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < output.length; i++) output[i] = Math.random() * 2 - 1;

            } catch (e) { console.error("Audio Init Failed", e); }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function startGame() {
            document.getElementById('start-menu').style.display = 'none';
            document.getElementById('game-over-menu').style.display = 'none';
            document.body.style.cursor = 'none'; 
            score = 0; totalHits = 0; currentLevel = 1; targetsInLevel = 0;
            document.getElementById('score-text').innerText = `SCORE: 0`;
            startLevelTransition();
        }

        function startLevelTransition() {
            gameState = 'transition';
            targetMole = null; arrows = []; particles = []; spawnTimer = 0;
            document.getElementById('game-ui').style.display = 'none';
            const trans = document.getElementById('transition-overlay');
            document.getElementById('trans-title').innerText = LEVEL_CONFIG[currentLevel].name;
            document.getElementById('trans-sub').innerText = LEVEL_CONFIG[currentLevel].sub;
            trans.style.opacity = 1;
            setTimeout(() => {
                trans.style.opacity = 0;
                setTimeout(() => {
                    document.getElementById('game-ui').style.display = 'block';
                    document.getElementById('level-display').innerText = `關卡 ${currentLevel} / 3`;
                    document.getElementById('combo-text').innerText = "準備迎擊！";
                    gameState = 'playing';
                    spawnTimer = 0; 
                }, 500);
            }, 2500);
        }

        function checkLevelProgress() {
            targetsInLevel++;
            if (targetsInLevel >= TARGETS_PER_LEVEL) {
                if (currentLevel < 3) {
                    currentLevel++; targetsInLevel = 0; startLevelTransition();
                } else { endGame(); }
            }
        }

        function endGame() {
            gameState = 'gameover';
            document.getElementById('game-ui').style.display = 'none';
            document.body.style.cursor = 'default';
            const goMenu = document.getElementById('game-over-menu');
            document.getElementById('final-score-text').innerText = score;
            let evalText = totalHits === 15 ? "神乎其技！你具備蝙蝠般的聽感與精確的反應！" :
                           totalHits >= 10 ? "卓越表現！聽音辨位已具備專業水準。" :
                           totalHits >= 5  ? "漸入佳境！試著閉上眼睛專注方位變化。" :
                                             "再接再厲！空間聽覺需要時間建立，多多練習。";
            document.getElementById('final-eval-text').innerHTML = evalText;
            goMenu.style.display = 'flex';
        }

        class TargetMole {
            constructor() {
                const typesArray = Object.values(WAVE_TYPES);
                this.type = typesArray[Math.floor(Math.random() * typesArray.length)];
                const zDepth = 4.0 + Math.random() * 8.0; 
                const margin = 80 * uiScale;
                const minScreenX = margin;
                const maxScreenX = width - margin;
                const targetScreenX = minScreenX + Math.random() * (maxScreenX - minScreenX);
                const fovScale = 400 * uiScale / (zDepth + 2.0); 
                const px = (targetScreenX - centerX) / fovScale;
                this.dist = Math.sqrt(px * px + zDepth * zDepth);
                this.angleRad = Math.atan2(px, zDepth); 
                this.updateProjection();
                this.pulse = 0;
                this.isDying = false;
                this.state = 0; 
                this.scale = 0; 
                
                const totalDuration = LEVEL_CONFIG[currentLevel].total;
                this.revealTimer = Math.floor(totalDuration / 2); 
                this.aliveTimer = Math.floor(totalDuration / 2); 
                
                this.nodes = [];
                this.initAudio();
                document.getElementById('combo-text').innerText = "🔊 聆聽方位！(隱形中)";
                document.getElementById('combo-text').style.color = "#ffaa44";
            }

            updateProjection() {
                const coords = getMappedCoords(this.angleRad, this.dist);
                this.x = coords.x; this.y = coords.y;
                this.audioX = coords.px; this.audioZ = coords.pz;
                this.depthScale = coords.depthScale;
            }

            initAudio() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                this.gain = audioCtx.createGain(); this.gain.gain.value = 0.0001; 
                this.panner = audioCtx.createPanner();
                this.panner.panningModel = 'HRTF'; this.panner.distanceModel = 'inverse'; 
                safeSetPanner(this.panner, this.audioX, 0, this.audioZ);
                this.conchaBoost = audioCtx.createBiquadFilter(); this.conchaBoost.type = 'peaking'; this.conchaBoost.frequency.value = 3500;
                this.headShadow = audioCtx.createBiquadFilter(); this.headShadow.type = 'lowpass';
                this.headShadow.frequency.value = Math.max(800, 20000 - (this.dist * 1200)); 

                if (this.type.id === 'bell') {
                    [440, 880, 1320].forEach((freq, i) => {
                        let osc = audioCtx.createOscillator(); let oscGain = audioCtx.createGain();
                        osc.type = 'sine'; osc.frequency.value = freq;
                        this.nodes.push({type: 'env', gain: oscGain, i: i, lastTrigger: 0});
                        osc.connect(oscGain); oscGain.connect(this.conchaBoost);
                        osc.start(now); this.nodes.push(osc);
                    });
                } else if (this.type.id === 'rotor') {
                    let osc = audioCtx.createOscillator(); osc.type = 'sawtooth'; osc.frequency.value = 80;
                    let lfo = audioCtx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 10.0; 
                    let lfoGain = audioCtx.createGain(); lfoGain.gain.value = 0.8;
                    let amNode = audioCtx.createGain(); amNode.gain.value = 0;
                    lfo.connect(lfoGain);
                    try { const off = audioCtx.createConstantSource(); off.offset.value = 0.5; off.start(now); off.connect(lfoGain.gain); this.nodes.push(off); } catch(e) {}
                    lfoGain.connect(amNode.gain); osc.connect(amNode); amNode.connect(this.conchaBoost);
                    osc.start(now); lfo.start(now); this.nodes.push(osc, lfo);
                } else if (this.type.id === 'frog') {
                    let osc = audioCtx.createOscillator(); osc.type = 'square'; osc.frequency.value = 250;
                    let filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.Q.value = 8.0; filter.frequency.value = 600;
                    let lfo = audioCtx.createOscillator(); lfo.type = 'sawtooth'; lfo.frequency.value = 3.0; 
                    let lfoGain = audioCtx.createGain(); lfoGain.gain.value = 1500;
                    lfo.connect(lfoGain); lfoGain.connect(filter.frequency); osc.connect(filter); filter.connect(this.conchaBoost);
                    osc.start(now); lfo.start(now); this.nodes.push(osc, lfo);
                } else if (this.type.id === 'wind') {
                    let src = audioCtx.createBufferSource(); src.buffer = noiseBuffer; src.loop = true;
                    let f = audioCtx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 2.0; f.frequency.value = 800;
                    src.connect(f); f.connect(this.conchaBoost);
                    src.start(now); this.nodes.push(src);
                }
                this.dryGain = audioCtx.createGain(); this.wetGain = audioCtx.createGain();
                this.dryGain.gain.value = Math.max(0.1, 1.0 / (1.0 + this.dist*0.5));
                this.wetGain.gain.value = Math.min(1.0, this.dist * 0.3);
                this.conchaBoost.connect(this.headShadow); this.headShadow.connect(this.panner);
                this.panner.connect(this.gain); this.gain.connect(this.dryGain); this.gain.connect(this.wetGain);
                this.dryGain.connect(masterCompressor); this.wetGain.connect(convolver);
                this.gain.gain.setTargetAtTime(0.5 * this.type.norm, now, 0.2); 
            }

            die(hit = false) {
                if (this.isDying) return;
                this.isDying = true;
                if (hit && audioCtx) {
                    const now = audioCtx.currentTime;
                    let hitPanner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : audioCtx.createPanner();
                    if (audioCtx.createStereoPanner) hitPanner.pan.value = Math.sin(this.angleRad);
                    else { hitPanner.panningModel = 'equalpower'; safeSetPanner(hitPanner, Math.sin(this.angleRad)*2.0, 0, 0); }
                    const pingOsc = audioCtx.createOscillator(); const pingGain = audioCtx.createGain();
                    pingOsc.type = 'sine'; pingOsc.frequency.setValueAtTime(2000 + Math.random()*500, now);
                    pingGain.gain.setValueAtTime(0.4, now); pingGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    pingOsc.connect(pingGain); pingGain.connect(hitPanner);
                    const noiseSrc = audioCtx.createBufferSource(); noiseSrc.buffer = noiseBuffer;
                    const noiseFilter = audioCtx.createBiquadFilter(); noiseFilter.type = 'highpass'; noiseFilter.frequency.value = 6000;
                    const noiseGain = audioCtx.createGain(); noiseGain.gain.setValueAtTime(0.3, now); noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    noiseSrc.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(hitPanner);
                    hitPanner.connect(masterCompressor); pingOsc.start(now); pingOsc.stop(now + 0.15); noiseSrc.start(now); noiseSrc.stop(now + 0.2);
                    createExplosion(this.x, this.y, this.type.color); totalHits++;
                } else if (!hit) {
                    document.getElementById('combo-text').innerText = "💨 錯失目標...";
                    document.getElementById('combo-text').style.color = "#ff4444";
                }
                if (this.gain && audioCtx) { try { this.gain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.1); } catch(e) {} }
                setTimeout(() => { this.cleanup(); targetMole = null; checkLevelProgress(); }, 800); 
            }

            cleanup() {
                this.nodes.forEach(n => { try { if(n.stop) n.stop(); } catch(e){} });
                if (this.gain) { try{this.gain.disconnect();}catch(e){} this.gain = null; }
            }

            update() {
                this.pulse += 0.08;
                if (this.isDying) { this.scale -= 0.15; return; }
                if (this.state === 0) {
                    this.revealTimer--;
                    if (this.revealTimer <= 0) {
                        this.state = 1; document.getElementById('combo-text').innerText = "🎯 出現了！射擊！";
                        document.getElementById('combo-text').style.color = "#64dcff";
                    }
                } else if (this.state === 1) {
                    if (this.scale < 1.0) this.scale += 0.15; 
                    this.aliveTimer--;
                    if (this.aliveTimer <= 0) this.die(false); 
                }
                if (audioCtx && this.gain && this.type.id === 'bell') {
                    const now = audioCtx.currentTime;
                    this.nodes.forEach(n => {
                        if (n.type === 'env' && now - n.lastTrigger > 1.0 + n.i*0.2) {
                            try { n.gain.gain.cancelScheduledValues(now); n.gain.gain.setTargetAtTime(1.0 / (n.i+1), now, 0.01); n.gain.gain.setTargetAtTime(0.0001, now + 0.1, 0.3); n.lastTrigger = now; } catch(e){}
                        }
                    });
                }
            }

            draw(ctx) {
                if (this.state === 0 || this.scale <= 0) return; 
                let currentSize = Math.max(2, 40 * uiScale * this.depthScale * this.scale); 
                if (this.type.id === 'bell' || this.type.id === 'rotor') currentSize *= 1.15; 
                let alpha = this.scale;
                if (this.aliveTimer < 40 && !this.isDying) alpha = Math.abs(Math.sin(this.pulse * 2.0)); 
                ctx.save(); ctx.translate(this.x, this.y); 
                const glowSize = Math.max(1, currentSize * 4.5);
                const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, glowSize);
                glow.addColorStop(0, `rgba(${this.type.color}, ${alpha * 0.6})`); glow.addColorStop(1, 'transparent');
                ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, 0, glowSize, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = `rgba(${this.type.color}, ${alpha})`; ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.9})`; 
                ctx.lineWidth = 2.0; ctx.lineJoin = 'round';
                if (this.type.id === 'bell') { 
                    ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, currentSize*0.6), Math.PI, 0); ctx.lineTo(currentSize*0.8, currentSize*0.5); ctx.lineTo(-currentSize*0.8, currentSize*0.5); ctx.closePath(); ctx.fill(); ctx.stroke();
                    ctx.beginPath(); ctx.arc(0, currentSize*0.7, Math.max(0.1, currentSize*0.2), 0, Math.PI*2); ctx.stroke();
                } else if (this.type.id === 'rotor') { 
                    ctx.rotate(this.pulse * 2.0); 
                    for(let i=0; i<4; i++) { ctx.rotate(Math.PI/2); ctx.beginPath(); ctx.ellipse(0, -currentSize*0.6, Math.max(0.1, currentSize*0.2), Math.max(0.1, currentSize*0.6), 0, 0, Math.PI*2); ctx.stroke(); }
                    ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, currentSize*0.3), 0, Math.PI*2); ctx.fill(); ctx.stroke();
                } else if (this.type.id === 'frog') { 
                    const pulseEye = Math.abs(Math.sin(this.pulse * 6)); 
                    ctx.beginPath(); ctx.ellipse(-currentSize*0.4, 0, Math.max(0.1, currentSize*0.4), Math.max(0.1, currentSize*0.3 * (1-pulseEye*0.5)), 0, 0, Math.PI*2); ctx.ellipse(currentSize*0.4, 0, Math.max(0.1, currentSize*0.4), Math.max(0.1, currentSize*0.3 * (1-pulseEye*0.5)), 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-currentSize*0.4, 0, Math.max(0.1, currentSize*0.1), 0, Math.PI*2); ctx.arc(currentSize*0.4, 0, Math.max(0.1, currentSize*0.1), 0, Math.PI*2); ctx.fill();
                } else if (this.type.id === 'wind') {
                    ctx.translate(-currentSize*0.6, 0);
                    for(let i=0; i<3; i++) { let yOff = (i-1) * currentSize*0.4; ctx.beginPath(); ctx.moveTo(0, yOff); ctx.bezierCurveTo(currentSize*0.6, yOff-currentSize*0.5, currentSize*0.6, yOff+currentSize*0.5, currentSize*1.2, yOff); ctx.stroke(); }
                }
                ctx.restore();
            }
        }

        class Arrow {
            constructor(angleRad) {
                this.angleRad = angleRad; this.dist = 0.5; 
                const coords = getMappedCoords(this.angleRad, this.dist);
                this.x = coords.x; this.y = coords.y;
                this.audioX = coords.px; this.audioZ = coords.pz;
                this.depthScale = coords.depthScale;
                // 箭矢航行時間
                this.distSpeed = 15.0 / 90.0; this.isDead = false;
                this.initAudio();
            }
            initAudio() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                this.gain = audioCtx.createGain(); this.panner = audioCtx.createPanner();
                this.panner.panningModel = 'HRTF'; this.panner.distanceModel = 'inverse'; this.panner.refDistance = 0.5;
                this.src = audioCtx.createBufferSource(); this.src.buffer = noiseBuffer; this.src.loop = true;
                this.filter = audioCtx.createBiquadFilter(); this.filter.type = 'bandpass'; this.filter.Q.value = 1.5;
                this.filter.frequency.setValueAtTime(6000, now); this.filter.frequency.exponentialRampToValueAtTime(300, now + 1.2); 
                this.src.connect(this.filter); this.filter.connect(this.panner);
                this.panner.connect(this.gain); this.gain.connect(masterCompressor); 
                this.gain.gain.setValueAtTime(0, now); this.gain.gain.linearRampToValueAtTime(1.5, now + 0.05); this.gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2); 
                this.src.start(now);
            }
            update() {
                this.dist += this.distSpeed; 
                const coords = getMappedCoords(this.angleRad, this.dist);
                this.x = coords.x; this.y = coords.y;
                this.audioX = coords.px; this.audioZ = coords.pz;
                this.depthScale = coords.depthScale;
                if (this.panner && audioCtx) safeSetPanner(this.panner, this.audioX, 0, this.audioZ);
                if (targetMole && targetMole.state === 1 && !targetMole.isDying) {
                    const dx3d = this.audioX - targetMole.audioX; const dz3d = this.audioZ - targetMole.audioZ;
                    if (Math.sqrt(dx3d*dx3d + dz3d*dz3d) < 2.0) { targetMole.die(true); this.die(); score += 100 * currentLevel; const sb = document.getElementById('score-text'); sb.innerText = `SCORE: ${score}`; const cb = document.getElementById('combo-text'); cb.innerText = "🎯 精準命中！"; cb.style.color = "#44ffaa"; setTimeout(() => { cb.style.transform = "scale(1)"; }, 150); }
                }
                if (this.dist > 15.0) this.die();
            }
            die() {
                this.isDead = true;
                if (this.gain && audioCtx) { try { this.gain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.05); setTimeout(() => { try{this.src.stop();}catch(e){} this.gain.disconnect(); }, 200); } catch(e){} }
            }
            draw(ctx) {
                if(isNaN(this.x) || isNaN(this.y)) return;
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angleRad); ctx.scale(this.depthScale, this.depthScale);
                ctx.strokeStyle = '#44ffaa'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 15*uiScale); ctx.lineTo(0, -15*uiScale); ctx.stroke();
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(0, -20*uiScale); ctx.lineTo(6*uiScale, -10*uiScale); ctx.lineTo(-6*uiScale, -10*uiScale); ctx.closePath(); ctx.fill();
                ctx.shadowBlur = 10; ctx.shadowColor = '#44ffaa'; ctx.strokeStyle = 'rgba(68, 255, 170, 0.3)'; ctx.beginPath(); ctx.moveTo(0, 15*uiScale); ctx.lineTo(0, 40*uiScale); ctx.stroke(); ctx.restore();
            }
        }

        function triggerBowImpulse(angle) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            let panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : audioCtx.createPanner();
            if (audioCtx.createStereoPanner) panner.pan.value = Math.sin(angle);
            else { panner.panningModel = 'equalpower'; safeSetPanner(panner, Math.sin(angle)*2.0, 0, 0); }
            const src = audioCtx.createBufferSource(); src.buffer = noiseBuffer;
            const filter = audioCtx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 4000; filter.Q.value = 5.0;
            const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.12, now + 0.002); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03); 
            src.connect(filter); filter.connect(gain); gain.connect(panner); panner.connect(masterCompressor); 
            src.start(now); src.stop(now + 0.05);
        }

        function updateBowAudio() {
            if (!audioCtx || gameState !== 'playing') return;
            let targetAngle = Math.atan2(pointerX - centerX, listenerPlaneY - pointerY); 
            if(isNaN(targetAngle)) targetAngle = 0;
            let delta = targetAngle - bowAngle;
            while (delta > Math.PI) delta -= Math.PI * 2;
            while (delta < -Math.PI) delta += Math.PI * 2;
            bowAngle += delta * 0.2; 
            const angularVelocity = Math.abs(bowAngle - lastBowAngle);
            rotationAccumulator += angularVelocity;
            if (rotationAccumulator > 0.06) {
                let ticks = Math.floor(rotationAccumulator / 0.06);
                rotationAccumulator -= ticks * 0.06;
                for(let i=0; i<Math.min(2, ticks); i++) triggerBowImpulse(bowAngle);
            }
            lastBowAngle = bowAngle;
        }

        function shootArrow() { if (gameState === 'playing' && !isNaN(bowAngle)) { arrows.push(new Arrow(bowAngle)); recoilTime = 10; if (audioCtx) { try { const tOsc = audioCtx.createOscillator(); const tGain = audioCtx.createGain(); tOsc.type = 'triangle'; tOsc.frequency.setValueAtTime(150, audioCtx.currentTime); tOsc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2); tGain.gain.setValueAtTime(0.5, audioCtx.currentTime); tGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3); tOsc.connect(tGain); tGain.connect(masterCompressor); tOsc.start(); tOsc.stop(audioCtx.currentTime + 0.3); } catch(e){} } } }

        function drawTrajectory() {
            if (gameState !== 'playing' || isNaN(bowAngle)) return;
            const time = Date.now() * 0.003;
            for(let i = 1; i <= 35; i++) {
                const pt1 = getMappedCoords(bowAngle, (i-1)*0.35); const pt2 = getMappedCoords(bowAngle, i*0.35-0.1);
                ctx.beginPath(); ctx.moveTo(pt1.x, pt1.y); ctx.lineTo(pt2.x, pt2.y);
                ctx.lineWidth = Math.max(0.5, 4 * uiScale * pt1.depthScale); 
                ctx.strokeStyle = `hsla(${(i*10-time*50)%360}, 100%, 65%, ${(Math.sin(i*0.4-time*4)+1)/2})`;
                ctx.stroke();
            }
        }

        function drawPlayer() {
            if(isNaN(centerX) || isNaN(listenerPlaneY) || isNaN(bowAngle)) return;
            ctx.save(); ctx.translate(centerX, listenerPlaneY); ctx.rotate(bowAngle);
            if (recoilTime > 0) { ctx.translate(0, 5 * uiScale); recoilTime--; }
            ctx.strokeStyle = '#ffaa44'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, 40 * uiScale, Math.PI + 0.5, 2 * Math.PI - 0.5); ctx.stroke();
            ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(Math.cos(Math.PI+0.5)*40*uiScale, Math.sin(Math.PI+0.5)*40*uiScale);
            ctx.lineTo(0, 10*uiScale); ctx.lineTo(Math.cos(2*Math.PI-0.5)*40*uiScale, Math.sin(2*Math.PI-0.5)*40*uiScale); ctx.stroke();
            ctx.strokeStyle = '#64dcff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 10*uiScale); ctx.lineTo(0, -35*uiScale); ctx.stroke();
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(0, -45*uiScale); ctx.lineTo(5*uiScale, -35*uiScale); ctx.lineTo(-5*uiScale, -35*uiScale); ctx.closePath(); ctx.fill();
            ctx.restore();
        }

        function drawSafeBackground() {
            const bgGrad = ctx.createRadialGradient(centerX, listenerPlaneY, 0, centerX, listenerPlaneY, height);
            bgGrad.addColorStop(0, '#021020'); bgGrad.addColorStop(1, '#000000');
            ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, width, height);
            ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(0, 204, 255, 0.15)';
            for (let i = -4; i <= 4; i++) { const a = (i * 15) * Math.PI / 180; ctx.beginPath(); ctx.moveTo(centerX, listenerPlaneY); ctx.lineTo(centerX + Math.sin(a) * width, listenerPlaneY - Math.cos(a) * height); ctx.stroke(); }
            [2, 4, 6, 8, 10, 12, 14].forEach(d => { ctx.beginPath(); for (let a = -Math.PI/2; a <= Math.PI/2; a += 0.1) { const c = getMappedCoords(a, d); if (a === -Math.PI/2) ctx.moveTo(c.x, c.y); else ctx.lineTo(c.x, c.y); } ctx.stroke(); });
            ctx.save(); ctx.shadowBlur = 20; ctx.shadowColor = 'rgba(0,204,255,0.3)'; ctx.fillStyle = 'rgba(0,204,255,0.1)'; ctx.strokeStyle = 'rgba(0,204,255,0.5)'; ctx.beginPath(); ctx.ellipse(centerX, listenerPlaneY, 40*uiScale, 15*uiScale, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
        }

        function animate() {
            try {
                drawSafeBackground();
                if (gameState === 'playing') {
                    updateBowAudio(); drawTrajectory(); drawPlayer();
                    if (!targetMole) {
                        spawnTimer++;
                        if (spawnTimer > 60) { targetMole = new TargetMole(); spawnTimer = 0; }
                    }
                    for (let i = particles.length - 1; i >= 0; i--) {
                        let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.03;
                        ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = `rgba(${p.color}, ${p.life})`;
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                        if (p.life <= 0) particles.splice(i, 1);
                    }
                    ctx.globalAlpha = 1.0;
                    for (let i = arrows.length - 1; i >= 0; i--) { arrows[i].update(); arrows[i].draw(ctx); if (arrows[i].isDead) arrows.splice(i, 1); }
                    if (targetMole) { targetMole.update(); targetMole.draw(ctx); }
                    ctx.save(); ctx.translate(pointerX, pointerY); ctx.strokeStyle = recoilTime > 0 ? '#ff4444' : 'rgba(100, 220, 255, 0.8)'; ctx.lineWidth = 2; const r = recoilTime > 0 ? 15*uiScale : 20*uiScale; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-r*1.5, 0); ctx.lineTo(-r*0.5, 0); ctx.moveTo(r*1.5, 0); ctx.lineTo(r*0.5, 0); ctx.moveTo(0, -r*1.5); ctx.lineTo(0, -r*0.5); ctx.moveTo(0, r*1.5); ctx.lineTo(0, r*0.5); ctx.stroke(); ctx.restore();
                } 
            } catch(e) { console.error(e); }
            requestAnimationFrame(animate);
        }

        function initLayout() {
            dpr = window.devicePixelRatio || 1; width = window.innerWidth; height = window.innerHeight;
            canvas.width = width * dpr; canvas.height = height * dpr; canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
            ctx.scale(dpr, dpr); centerX = width / 2; listenerPlaneY = height * 0.9; displayRadiusX = width * 0.6; displayRadiusY = height * 0.5; uiScale = width / 1000 + 0.5;
        }

        document.getElementById('unlock-overlay').addEventListener('click', unlockAudioAndStart);
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
        window.addEventListener('pointermove', e => { pointerX = e.clientX; pointerY = e.clientY; });
        window.addEventListener('pointerdown', e => { if (gameState === 'playing') shootArrow(); });
        window.addEventListener('resize', initLayout); initLayout(); animate();
    </script>
</body>
</html>
